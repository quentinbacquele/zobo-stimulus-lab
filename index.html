<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimulus lab</title>
<style>
/* Layout: a column of control panels beside the charts.
   Hierarchy: page title 24, part titles 18 bold, sub-part titles 14.5 bold, values and detail regular. */
:root {
  color-scheme: light;
  --page: #f3f4f6; --surface: #ffffff; --track: #e3e5ea; --thumb: #ffffff;
  --ink: #14161a; --ink-2: #4a5060; --muted: #6b7280;
  --grid: #eceef2; --axis: #c5c9d1; --ghost: #9aa1ad; --border: rgba(20, 22, 26, .10);
  --accent: #2563c9; --band: .10; --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --shadow: 0 1px 2px rgba(20, 22, 26, .05), 0 8px 24px rgba(20, 22, 26, .06);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #17191e; --surface: #20232b; --track: #2b2f39; --thumb: #474d5b;
  --ink: #f3f4f6; --ink-2: #c5cad3; --muted: #9aa1ad;
  --grid: #2c303a; --axis: #474d5b; --ghost: #7d8492; --border: rgba(255, 255, 255, .09);
  --accent: #6a9df2; --band: .16;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--sans); }
.app { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-inline: 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.top-actions { display: flex; align-items: center; gap: 20px; }
h1 .tag { margin-left: 10px; letter-spacing: 0; vertical-align: middle; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }

/* Controls */
button { font: inherit; color: inherit; cursor: pointer; }
.quiet { padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.quiet:hover { color: var(--ink); }
a.quiet { text-decoration: none; }
.controls { display: grid; gap: 16px; }
.title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
summary.title { cursor: pointer; }
.panel { display: grid; gap: 18px; padding: 20px 20px 22px; box-shadow: none; }
details.panel { display: block; }
.fields { display: grid; gap: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--track); border-radius: 10px; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 6px; border-radius: 8px; text-align: center; color: var(--ink-2); font-size: 14.5px; font-weight: 550; white-space: nowrap; }
.seg input:checked + span { background: var(--thumb); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(20, 22, 26, .14); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.field { display: grid; gap: 8px; }
.field-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; }
.field-head output { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
input[type=range] { display: block; width: 100%; height: 20px; margin: 0; accent-color: var(--accent); }
select, input[type=number] {
  width: 100%; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14.5px; font-variant-numeric: tabular-nums;
}
#song { padding: 0 4px 0 10px; font-size: 12.5px; }
#seed { font-family: var(--mono); font-size: 13.5px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); color: var(--ink);
  font-size: 14.5px; font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { padding: 0 22px; background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 700; }
.btn.compact { height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn.icon { width: 38px; height: 38px; padding: 0; }
.btn.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.icon .sun, :root[data-theme="dark"] .btn.icon .moon { display: none; }
:root[data-theme="dark"] .btn.icon .sun { display: block; }
.btn.square { width: 32px; height: 28px; padding: 0; border-radius: 8px; font-size: 17px; line-height: 1; }
.stepper { display: flex; gap: 6px; }
.btn svg { width: 11px; height: 11px; fill: currentColor; }
.btn .stop, .btn.playing .go { display: none; }
.btn.playing .stop { display: block; }
:is(button, select, input[type=number], summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { cursor: pointer; }
.check span { display: flex; align-items: center; gap: 10px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-top: 14px; }
.grid-2 .field-head { font-size: 13.5px; }

/* Charts */
main { display: grid; gap: 16px; min-width: 0; }
.card { min-width: 0; padding: 22px 24px 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 14px; }
.heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.subject { color: var(--ink-2); font-family: var(--mono); font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.key { display: inline-block; width: 18px; margin-right: 7px; border-top: 2px solid var(--ghost); border-radius: 2px; vertical-align: middle; }
.key.bar { width: 11px; height: 11px; border: 0; border-radius: 3px; background: var(--muted); }
.key.obs { border-color: var(--ink); }
.key.none { border-color: transparent; }
.chart-wrap { position: relative; }
svg.chart { display: block; width: 100%; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.type { fill: var(--ink-2); font-size: 11.5px; font-weight: 550; text-anchor: middle; }
.grid-line { stroke: var(--grid); }
.axis-line { stroke: var(--axis); }
.band { opacity: var(--band); }
.line-ref, .line-out { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.line-ref { stroke: var(--ghost); stroke-width: 1.75; }
.line-out { stroke-width: 3.5; }
.line-glide { fill: none; stroke: var(--ink-2); stroke-width: 3.5; stroke-linecap: round; }
.line-glide.thin { stroke-width: 1.6; }
.line-glide.small { stroke-width: 2.2; }
.line-mini, .line-small { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.line-small { stroke-width: 2.2; }
.fragment { fill: var(--track); opacity: .65; }
.fragment.alt { opacity: .3; }
.range { fill: var(--track); }
.zero { stroke: var(--axis); }
.spot { fill: var(--ghost); stroke: var(--page); stroke-width: 1.5; }
.spot.on { fill: var(--ink); }
.pick { fill: transparent; cursor: pointer; }
.bracket { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.frag-label { fill: var(--ink-2); font-size: 12px; font-weight: 650; text-anchor: middle; }
.detail { margin-top: 18px; }
.pill, .was { text-anchor: middle; dominant-baseline: central; }
.pill { font-size: 13px; font-weight: 700; }
.was { fill: var(--ink-2); font-size: 12.5px; font-weight: 550; }
.dense :is(.pill, .was) { font-size: 10px; }
.cross { stroke: var(--axis); }
.dot { stroke: var(--surface); stroke-width: 2; }
.dot.ref { fill: var(--ghost); }
.playhead { stroke: var(--ink); stroke-width: 1.5; }
.obs { stroke: var(--ink); stroke-width: 2; }
.wash { fill: var(--track); opacity: .6; }
.row-label { fill: var(--ink); font-size: 15px; font-weight: 700; }
.row-detail { fill: var(--ink-2); font-size: 13.5px; font-weight: 500; }
.caption { fill: var(--ink-2); font-size: 12.5px; font-weight: 550; text-anchor: middle; }
.tip {
  position: absolute; z-index: 2; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); box-shadow: 0 6px 20px rgba(20, 22, 26, .16);
  font-size: 13px; white-space: nowrap; pointer-events: none;
}
.tip-head { font-weight: 700; }
.tip-head:not(:last-child) { margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; color: var(--ink-2); }
.tip-row b { margin-right: 6px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.tip-row .key { flex: none; }
.tip-row .key.bar { margin-right: 14px; }
.transport { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.transport .spacer { flex: 1; }
.table-scroll { margin-top: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--axis); text-align: left; white-space: nowrap; }
td { border-color: var(--grid); }
th { color: var(--ink-2); font-size: 12.5px; font-weight: 650; }
td:nth-child(2) { font-weight: 650; }
td.source { font-family: var(--mono); font-size: 12.5px; }
th:last-child, td:last-child { padding-right: 0; }
th.num, td.num { text-align: right; }
.swatch { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border-radius: 3px; vertical-align: -1px; }

/* Stimulus sets: what a set is, the row of sets, the set on screen, then the data of all sets. */
.part { margin: 56px 0 0; font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.sets { display: grid; gap: 16px; }
.recipe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 8px; color: var(--ink-2); font-size: 13.5px; }
.tag { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 650; }
.tag small { color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.meta, .none { color: var(--ink-2); font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* The row of sets: one button per set, arrows to step, and the way to make a new one. */
.set-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
.pager { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.pager .btn.square { flex: none; width: 36px; height: 36px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
  position: relative; min-width: 40px; height: 36px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 10px;
  background: var(--surface); color: var(--ink-2); font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums;
}
.tab:hover { border-color: var(--ink-2); color: var(--ink); }
.tab[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.tab.some::after, .tab.done::after {
  content: ""; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px;
  border: 2px solid var(--page); border-radius: 50%; background: var(--warn);
}
.tab.done::after { background: var(--good); }
.set-bar > .btn { flex: none; }

/* The set on screen. */
.set-list { display: grid; gap: 16px; }
.set-name { display: grid; gap: 2px; }
.blank { display: grid; gap: 4px; padding: 40px 24px; color: var(--ink-2); text-align: center; }
.blank b { color: var(--ink); font-size: 16px; }
.session { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 18px; padding: 14px 16px; border-radius: 10px; background: var(--page); }
.session label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 700; }
.session input {
  width: 150px; height: 38px; padding: 0 10px; border: 1px solid var(--axis); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14.5px; font-weight: 400; font-variant-numeric: tabular-nums;
}
.session input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.quick { display: flex; gap: 18px; align-items: center; height: 38px; margin-left: auto; }
.set-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.set-table th { padding: 0 14px 10px 0; border-bottom: 1px solid var(--axis); color: var(--ink); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.set-table td { padding: 16px 14px 16px 0; border-bottom: 1px solid var(--grid); font-weight: 400; vertical-align: top; white-space: normal; }
.set-table th:last-child, .set-table td:last-child { padding-right: 0; text-align: left; }
.set-table td.stimulus { width: 42%; }
.stimulus-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.order { flex: none; width: 18px; font-size: 20px; font-weight: 750; text-align: center; }
.btn.round { flex: none; width: 36px; height: 36px; padding: 0; border-radius: 50%; }
.stimulus-open { display: grid; gap: 1px; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
.stimulus-open b { font-size: 15.5px; font-weight: 700; }
.stimulus-open:hover b { text-decoration: underline; }
.set-table input[type=number] { width: 68px; height: 38px; padding: 0 8px; }
.set-table input[type=time] {
  width: 104px; height: 38px; padding: 0 8px; border: 1px solid var(--axis); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14.5px; font-variant-numeric: tabular-nums;
}
.set-table input[type=time]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.clock { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.clock input[type=number] { width: 56px; }
.set-table td.comments { width: 21%; }
.set-table textarea {
  display: block; width: 100%; min-width: 150px; min-height: 38px; padding: 8px 10px; border: 1px solid var(--axis); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; resize: vertical;
}
.set-table textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.set-foot { display: flex; justify-content: flex-end; align-items: center; min-height: 24px; padding-top: 14px; }
.sure { display: inline-flex; align-items: center; gap: 14px; }
.danger:hover { color: var(--bad); }

/* The data of every set: stored here, saved to a file, brought back from a file. */
.data-card { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; }
.data-text { display: grid; gap: 4px; }
.data-text p { margin: 0; }
.data-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.backup { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.backup::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.backup.good::before { background: var(--good); }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 5; max-width: calc(100vw - 32px); padding: 11px 18px; border-radius: 12px;
  background: var(--ink); color: var(--surface); box-shadow: 0 8px 28px rgba(20, 22, 26, .28);
  font-size: 14px; font-weight: 600; transform: translateX(-50%);
}

.empty .layout, .empty .sets, .missing { display: none; }
.empty .missing { display: block; }
[hidden] { display: none !important; }

@media (min-width: 861px) { .controls { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; } }
@media (max-width: 600px) { .set-bar { flex-wrap: wrap; } .set-bar > .btn { width: 100%; } }
/* Narrow screens: each stimulus becomes a block, with its fields labelled underneath. */
@media (max-width: 900px) {
  .set-table, .set-table tbody, .set-table tr, .set-table td { display: block; width: auto; }
  .set-table tr:first-child { display: none; }
  .set-table td { padding: 6px 0; border: 0; }
  .set-table td.stimulus, .set-table td.comments { width: auto; }
  .set-table tr { padding: 14px 0; border-bottom: 1px solid var(--grid); }
  .set-table tr:last-child { padding-bottom: 0; border-bottom: 0; }
  .set-table td[data-label] { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 10px; }
  .set-table td[data-label]::before { content: attr(data-label); font-size: 13.5px; font-weight: 700; }
}
@media (max-width: 860px) {
  .app { padding-block: 20px 40px; padding-inline: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .card { padding: 16px 14px 18px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Stimulus lab <span class="tag" id="offline-tag" hidden title="This page was opened from a file on this device and works without internet. Its sets and notes are separate from those of the online page: use Download data and Import data to move them.">Offline copy</span></h1>
    <button class="btn icon" id="theme" type="button">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <p class="missing">No data embedded yet. Run <code>field/build_stimulus_lab.py</code>, then reload this page.</p>

  <div class="layout">
    <aside class="controls">
      <section class="card panel">
        <h2 class="title">Song fragment</h2>
        <div class="field">
          <span class="field-head"><span>Form</span></span>
          <div class="seg" id="morph" role="radiogroup" aria-label="Form"></div>
        </div>
        <div class="field">
          <span class="field-head">
            <label for="song">Fragment</label>
            <span class="stepper">
              <button class="btn square" id="prev" type="button" aria-label="Previous fragment">&lsaquo;</button>
              <button class="btn square" id="next" type="button" aria-label="Next fragment">&rsaquo;</button>
            </span>
          </span>
          <select id="song"></select>
        </div>
        <div class="field" title="Own bias: the bias at which a drawn fragment would lean toward its form as much as this recorded one does. 0 is the form's typical mix. Each dot is a fragment; the shaded band is where 90% of fragments of this length would fall if their notes were drawn from the typical mix.">
          <span class="field-head"><span>Own bias</span><output id="own-out"></output></span>
          <div class="chart-wrap">
            <svg class="chart" id="spectrum-chart" role="img" aria-label="Where this fragment sits among the fragments of its form"></svg>
            <div class="tip" id="spectrum-tip" hidden></div>
          </div>
        </div>
      </section>

      <section class="card panel">
        <h2 class="title">Treatment</h2>
        <div class="seg" id="treatment" role="radiogroup" aria-label="Treatment">
          <label title="The recorded fragment, as a pure-tone resynthesis"><input type="radio" name="treatment" value="original"><span>Original</span></label>
          <label title="Same rhythm; the notes least specific to the form are replaced, so the fragment over-uses its form's own note types"><input type="radio" name="treatment" value="maximized"><span>Maximized</span></label>
          <label title="Same notes and timing; less frequency modulation inside each note"><input type="radio" name="treatment" value="attenuated"><span>Attenuated</span></label>
        </div>

        <div class="fields" id="maximized-controls" hidden>
          <label class="field" title="0 leaves the fragment as recorded. Each step multiplies the share of every note type by how many times more this form uses it than the other form, so the least specific notes are replaced first and, at high bias, almost everything becomes the form's most specific type. The experiment uses 2.5.">
            <span class="field-head"><span>Bias</span><output id="bias-out"></output></span>
            <input type="range" id="bias" min="0" max="10" step="0.5">
          </label>
          <div class="field" title="The seed fixes which note sequence is drawn, so a stimulus can be rebuilt.">
            <label class="field-head" for="seed"><span>Seed</span></label>
            <div class="row">
              <input type="number" id="seed" min="0" max="4294967295" step="1">
              <button class="btn" id="reseed" type="button">New draw</button>
            </div>
          </div>
        </div>

        <div class="fields" id="attenuated-controls" hidden>
          <div class="field">
            <span class="field-head"><span>Method</span></span>
            <div class="seg" id="method" role="radiogroup" aria-label="Attenuation method">
            <label title="Current field method: smooth the contour, then shrink it around the note's mean pitch"><input type="radio" name="method" value="smooth"><span>Smooth + scale</span></label>
            <label title="Rebuild each note from its first principal components of the final-analysis PCA"><input type="radio" name="method" value="pca"><span>PC reconstruction</span></label>
            </div>
          </div>
          <div class="fields" id="smooth-controls">
            <label class="field" title="Share of each note's frequency excursion kept around its mean pitch. The experiment uses 0%.">
              <span class="field-head"><span>Modulation kept</span><output id="fm-out"></output></span>
              <input type="range" id="fm" min="0" max="100" step="5">
            </label>
            <label class="field" title="Gaussian smoothing applied before scaling. Default: 2 frames.">

<script>
/* Signal code: a port of field/generate_high_lbhb_stimuli.py, plus PC reconstruction
   as in notebooks/zosterops_manuscript.ipynb (sections 2.2 and 3.1). */
const Lab = (() => {
  'use strict';

  const FRAME_RATE = 22050 / 90;  // contour frames per second (hop 90 at 22.05 kHz)
  const SAMPLE_RATE = 44100;
  const MIN_NOTES = 15;           // shorter song fragments are not used
  // Settings of the playback experiment. Both pages start from them.
  const EXPERIMENT = { bias: 2.5, method: 'smooth', fm: 0, sigma: 2, pcs: 5, flat: false, join: false,
    gap: 65, pause: 130, target: 60, lead: 100, trail: 100, fade: 5, level: -20, sampleRate: SAMPLE_RATE };
  const EPS = 1e-6;
  const SMOOTHING = 0.005;        // added to both shares before taking their ratio
  const BIAS_LIMIT = 30;
  const PRIOR_NOTES = 1;          // weight of the form's typical mix when biasing a fragment, in notes

  // Python's round(): ties go to the even integer.
  function pyRound(x) {
    const floor = Math.floor(x), rest = x - floor;
    if (rest < 0.5) return floor;
    if (rest > 0.5) return floor + 1;
    return floor % 2 === 0 ? floor : floor + 1;
  }

  function mean(values) {
    let sum = 0;
    for (let i = 0; i < values.length; i++) sum += values[i];
    return sum / values.length;
  }

  function modulationRms(contour) {
    const centre = mean(contour);
    let sum = 0;
    for (let i = 0; i < contour.length; i++) sum += (contour[i] - centre) ** 2;
    return Math.sqrt(sum / contour.length);
  }

  function bytesFromBase64(text) {
    const binary = atob(text), bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function decode(raw) {
    const palette = Float64Array.from(raw.palette);
    const index = new Uint16Array(bytesFromBase64(raw.contours).buffer);
    const nNotes = raw.length.length;
    const offset = new Uint32Array(nNotes + 1);
    for (let i = 0; i < nNotes; i++) offset[i + 1] = offset[i] + raw.length[i];

    const noteSong = new Int32Array(nNotes);
    let first = 0;
    const songs = raw.songs.map(([name, bird, morph, n], s) => {
      noteSong.fill(s, first, first + n);
      first += n;
      return { name, bird, morph, first: first - n, n };
    });
    const noteName = (i) => `S${raw.order[i]}_${songs[noteSong[i]].name}`;

    // Donor pools: every note of a morph, by note type.
    const pools = raw.morphs.map(() => raw.letters.map(() => []));
    for (let i = 0; i < nNotes; i++) pools[songs[noteSong[i]].morph][raw.cluster[i]].push(i);

    const cumulative = [];
    raw.pca.variance.reduce((sum, value) => (cumulative.push(sum + value), sum + value), 0);

    return {
      meta: raw.meta, morphs: raw.morphs, letters: raw.letters, templates: raw.templates,
      profiles: raw.profiles.map((profile) => Float64Array.from(profile)),
      songs, noteSong, noteName, pools,
      order: raw.order, cluster: raw.cluster, length: raw.length,
      contour(i) {
        const out = new Float64Array(raw.length[i]);
        for (let k = 0; k < out.length; k++) out[k] = palette[index[offset[i] + k]];
        return out;
      },
      pca: {
        size: raw.pca.mean.length,
        mean: Float64Array.from(raw.pca.mean),
        loadings: new Float64Array(bytesFromBase64(raw.pca.loadings).buffer),
        cumulative,
      },
    };
  }

  // ---- Attenuation ------------------------------------------------------------

  // scipy.ndimage.gaussian_filter1d(mode="nearest"); sigma 0 leaves the contour as is.
  function gaussianSmooth(contour, sigma) {
    if (!(sigma > 0)) return Float64Array.from(contour);
    const radius = Math.floor(4 * sigma + 0.5);
    const weights = new Float64Array(2 * radius + 1);
    let total = 0;
    for (let k = -radius; k <= radius; k++) total += weights[k + radius] = Math.exp(-0.5 / (sigma * sigma) * (k * k));
    const n = contour.length, out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let sum = 0;
      for (let k = -radius; k <= radius; k++) {
        sum += weights[k + radius] / total * contour[Math.min(n - 1, Math.max(0, i + k))];
      }
      out[i] = sum;
    }
    return out;
  }

  // Current field method: smooth, restore the excursion RMS, then scale around the note mean.
  function attenuate(contour, scale, sigma) {
    const centre = mean(contour);
    const smoothed = gaussianSmooth(contour, sigma);
    const smoothedCentre = mean(smoothed);
    const original = modulationRms(contour), remaining = modulationRms(smoothed);
    const gain = remaining > 0 ? original / remaining : 1;
    return smoothed.map((value) => centre + scale * ((value - smoothedCentre) * gain));
  }

  // Final analysis: short contours decay toward their own mean up to 80 samples.
  function extendContour(contour, target) {
    const n = contour.length;
    if (n > target) throw new Error('A contour exceeds the PCA length.');
    if (n === target) return Float64Array.from(contour);
    const centre = mean(contour), last = contour[n - 1] - centre, extra = target - n;
    const out = new Float64Array(target);
    out.set(contour);
    const decay = Math.log(1 + Math.abs(last)) / extra;
    for (let k = 1; k <= extra; k++) {
      let tail = 0;
      if (Math.abs(last) > 1e-8) {
        tail = last * Math.exp(-decay * k);
        tail = last < 0 ? Math.max(tail, last) : Math.min(tail, last);
      }
      out[n + k - 1] = tail + centre;
    }
    return out;
  }

  function pcScores(contour, pca) {
    const size = pca.size, extended = extendContour(contour, size);
    const scores = new Float64Array(size);
    for (let j = 0; j < size; j++) {
      let sum = 0;
      for (let t = 0; t < size; t++) sum += (extended[t] - pca.mean[t]) * pca.loadings[j * size + t];
      scores[j] = sum;
    }
    return scores;
  }

  // Rebuild a note from its first k PCs, over its recorded length only.
  function pcReconstruct(contour, k, pca) {
    const scores = pcScores(contour, pca), out = new Float64Array(contour.length);
    for (let t = 0; t < out.length; t++) {
      let sum = 0;
      for (let j = 0; j < k; j++) sum += scores[j] * pca.loadings[j * pca.size + t];
      out[t] = sum + pca.mean[t];
    }
    return out;
  }

  // ---- Bias -------------------------------------------------------------------

  // How many times more a morph uses each note type than the other morph does. Shares are
  // padded by SMOOTHING (about the standard error of a share) so rare types cannot dominate.
  function usageRatio(target, other) {
    return target.map((p, i) => (p + SMOOTHING) / (other[i] + SMOOTHING));
  }

  // Each type's share is multiplied by its usage ratio, `bias` times over: bias 0 is the
  // morph's typical mix, and the mix narrows onto the most specific types as bias grows.
  function biasedProfile(target, other, bias) {
    const ratio = usageRatio(target, other);
    const out = target.map((p, i) => p * ratio[i] ** bias);
    const total = out.reduce((sum, value) => sum + value, 0);
    if (!(total > 0)) throw new Error('Biased profile collapsed to zero.');
    return out.map((value) => value / total);
  }

  // How strongly a sequence's mix leans toward the morph: its mean log usage ratio.
  function leaning(sequence, ratio) {
    let sum = 0;
    for (const cluster of sequence) sum += Math.log(ratio[cluster]);
    return sum / sequence.length;
  }

  // Leaning of single notes drawn from a profile: mean and spread.
  function profileLeaning(profile, ratio) {
    let total = 0, mean = 0, square = 0;
    profile.forEach((share, i) => {
      total += share; mean += share * Math.log(ratio[i]); square += share * Math.log(ratio[i]) ** 2;
    });
    mean /= total;
    return { mean, sd: Math.sqrt(Math.max(0, square / total - mean * mean)) };
  }

  // The bias whose biased profile leans, on average, as much as `value` (bisection).
  function biasForLeaning(value, target, other) {
    const ratio = usageRatio(target, other);
    let low = -BIAS_LIMIT, high = BIAS_LIMIT;
    const expected = (bias) => profileLeaning(biasedProfile(target, other, bias), ratio).mean;
    if (value <= expected(low)) return low;
    if (value >= expected(high)) return high;
    for (let step = 0; step < 50; step++) {
      const middle = (low + high) / 2;
      if (expected(middle) < value) low = middle; else high = middle;
    }
    return (low + high) / 2;
  }

  function logRatio(target, other) {
    return target.map((p, i) => Math.log((p + EPS) / (other[i] + EPS)));
  }

  function characteristicScore(sequence, ratio) {
    let sum = 0;
    for (const cluster of sequence) sum += ratio[cluster];
    return sum / sequence.length;
  }

  function mulberry32(seed) {
    let state = seed >>> 0;
    return () => {
      state = (state + 0x6D2B79F5) | 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fisher-Yates, in place.
  function shuffle(items, random) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
  }

  // The fragment's own note mix, tilted toward the form's specific types: each type's share is
  // multiplied by its usage ratio, `bias` times over, so bias 0 is the fragment as recorded.
  // The form's typical mix is blended in with the weight of PRIOR_NOTES notes, which lets
  // specific types the fragment lacks come in as the bias grows.
  function biasedMix(counts, target, other, bias) {
    const ratio = usageRatio(target, other), n = counts.reduce((sum, count) => sum + count, 0);
    const out = Float64Array.from(counts, (count, i) => (count + PRIOR_NOTES * target[i]) / (n + PRIOR_NOTES) * ratio[i] ** bias);
    const total = out.reduce((sum, value) => sum + value, 0);
    return out.map((value) => value / total);
  }

  // Whole numbers of notes per type that follow a mix as closely as possible (largest remainders).
  function apportion(mix, n) {
    const quota = Array.from(mix, (share) => share * n), counts = quota.map((value) => Math.floor(value + 1e-9));
    const left = n - counts.reduce((sum, count) => sum + count, 0);
    const rounded = (value) => Math.round(value * 1e9);
    const order = quota.map((_, i) => i).sort((a, b) =>
      rounded(quota[b] - counts[b]) - rounded(quota[a] - counts[a]) || rounded(quota[b]) - rounded(quota[a]) || a - b);
    for (let k = 0; k < left; k++) counts[order[k]]++;
    return counts;
  }

  // Reach the maximized note counts while changing as few notes as possible: surplus notes of a
  // type are given up at random positions, and the freed positions receive the types in demand.
  function biasSequence(sequence, quota, seed) {
    const random = mulberry32(seed), result = sequence.slice(), freed = [], wanted = [];
    quota.forEach((count, type) => {
      const positions = sequence.flatMap((cluster, k) => cluster === type ? [k] : []);
      if (positions.length > count) freed.push(...shuffle(positions, random).slice(0, positions.length - count));
      for (let k = positions.length; k < count; k++) wanted.push(type);
    });
    freed.sort((a, b) => a - b);
    shuffle(wanted, random);
    freed.forEach((position, k) => { result[position] = wanted[k]; });
    return result;
  }

  const durationS = (nFrames) => Math.max(1, nFrames - 1) / FRAME_RATE;

  // Notes that keep their type stay as recorded. Each replaced position borrows the same-form
  // note of its new type that is closest in duration, preferring notes not used yet.
  function chooseDonors(data, morph, sequence, targetDurations, recorded) {
    const kept = sequence.map((cluster, k) => data.cluster[recorded[k]] === cluster);
    const used = new Set(recorded.filter((_, k) => kept[k]));
    return sequence.map((cluster, position) => {
      if (kept[position]) return recorded[position];
      let best = -1, bestUnused = -1, gap = Infinity, gapUnused = Infinity;
      for (const i of data.pools[morph][cluster]) {
        const difference = Math.abs(durationS(data.length[i]) - targetDurations[position]);
        const beats = (j, g) => difference < g || (difference === g && data.noteName(i) < data.noteName(j));
        if (best < 0 || beats(best, gap)) { best = i; gap = difference; }
        if (!used.has(i) && (bestUnused < 0 || beats(bestUnused, gapUnused))) { bestUnused = i; gapUnused = difference; }
      }
      const donor = bestUnused >= 0 ? bestUnused : best;
      used.add(donor);
      return donor;
    });
  }

  // ---- Synthesis --------------------------------------------------------------

  // numpy.interp for increasing x.
  function interpolate(x, xp, fp) {
    const out = new Float64Array(x.length), last = xp.length - 1;
    let j = 0;
    for (let i = 0; i < x.length; i++) {
      while (j < last && xp[j + 1] <= x[i]) j++;
      if (j >= last || xp[j] === x[i]) out[i] = fp[j];
      else out[i] = (fp[j + 1] - fp[j]) / (xp[j + 1] - xp[j]) * (x[i] - xp[j]) + fp[j];
    }
    return out;
  }

  function linspace(stop, count) {
    const out = new Float64Array(count), step = count > 1 ? stop / (count - 1) : 0;
    for (let i = 0; i < count; i++) out[i] = i * step;
    if (count > 1) out[count - 1] = stop;
    return out;
  }

  // Stretch a donor contour onto the paired note's number of frames.
  function resizeContour(contour, nFrames) {
    if (contour.length === nFrames) return Float64Array.from(contour);
    return interpolate(linspace(1, nFrames), linspace(1, contour.length), contour);
  }

  const noteSamples = (contour, sampleRate) => Math.max(2, pyRound(durationS(contour.length) * sampleRate));

  // Frequency of a note at every output sample.
  function noteFrequency(contour, sampleRate) {
    const n = noteSamples(contour, sampleRate);
    const sourceTimes = Float64Array.from(contour, (_, i) => i / FRAME_RATE);
    const outputTimes = Float64Array.from({ length: n }, (_, i) => i / sampleRate);
    return interpolate(outputTimes, sourceTimes, contour);
  }

  // A pure tone that follows a frequency track, with a raised-cosine fade at each end.
  function tone(frequency, sampleRate, fadeMs) {
    const n = frequency.length;
    const audio = new Float64Array(n), envelope = new Float64Array(n).fill(1);
    let cycles = 0;
    for (let i = 0; i < n; i++) {
      cycles += frequency[i];
      audio[i] = Math.sin(2 * Math.PI * cycles / sampleRate);
    }
    const fade = Math.min(Math.floor(n / 2), Math.max(2, pyRound(fadeMs / 1000 * sampleRate)));
    const ramp = linspace(Math.PI, fade).map((angle) => 0.5 * (1 - Math.cos(angle)));
    for (let i = 0; i < fade; i++) envelope[i] *= ramp[i];
    for (let i = 0; i < fade; i++) envelope[n - fade + i] *= ramp[fade - 1 - i];
    const active = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      audio[i] *= envelope[i];
      active[i] = envelope[i] > 0.01 ? 1 : 0;
    }
    return { audio, active };
  }

  const synthesizeNote = (contour, sampleRate, fadeMs) => tone(noteFrequency(contour, sampleRate), sampleRate, fadeMs);

  // A whole fragment as one continuous whistle: the notes keep their place, and each silence
  // between two notes becomes a straight glide from the end of one to the start of the next.
  function synthesizeWhistle(notes, plan, sampleRate, fadeMs) {
    const track = new Float64Array(plan.end - plan.starts[0]);
    let cursor = 0, last = 0;
    notes.forEach((note, k) => {
      const frequency = noteFrequency(note.contour, sampleRate), at = plan.starts[k] - plan.starts[0];
      for (let i = cursor; i < at; i++) track[i] = last + (frequency[0] - last) * (i - cursor + 1) / (at - cursor + 1);
      track.set(frequency, at);
      cursor = at + frequency.length;
      last = frequency[frequency.length - 1];
    });
    return tone(track, sampleRate, fadeMs);
  }

  // Where every note and every repetition falls. One fragment is laid out as in the field
  // script, then repeated after `pause` ms of silence until the whole stimulus lasts at
  // least `target` seconds. `lengths` are the notes' lengths in samples.
  function planTiming(lengths, sampleRate, timing) {
    const onsets = [timing.lead / 1000];
    for (let k = 0; k < lengths.length - 1; k++) {
      onsets.push(onsets[k] + lengths[k] / sampleRate + timing.gap / 1000);
    }
    const starts = onsets.map((onset) => pyRound(onset * sampleRate));
    const end = Math.max(...lengths.map((length, k) => starts[k] + length));
    const trail = pyRound(timing.trail / 1000 * sampleRate);
    const period = end - starts[0] + pyRound((timing.pause || 0) / 1000 * sampleRate);
    let repeats = 1;
    while ((end + (repeats - 1) * period + trail) / sampleRate < (timing.target || 0)) repeats++;
    const fragments = Array.from({ length: repeats }, (_, r) =>
      [(starts[0] + r * period) / sampleRate, (end + r * period) / sampleRate]);
    return { onsets, starts, end, period, repeats, samples: end + (repeats - 1) * period + trail, fragments };
  }

  function assemble(notes, plan) {
    const audio = new Float64Array(plan.samples), active = new Uint8Array(plan.samples);
    for (let r = 0; r < plan.repeats; r++) {
      notes.forEach((note, k) => {
        const at = plan.starts[k] + r * plan.period;
        for (let i = 0; i < note.audio.length; i++) {
          audio[at + i] += note.audio[i];
          active[at + i] |= note.active[i];
        }
      });
    }
    return { audio, active };
  }

  // Match the RMS of the sounding samples, then cap peaks at -1 dBFS.
  function normalize(audio, active, targetDbfs) {
    const activeRms = () => {
      let sum = 0, count = 0;
      for (let i = 0; i < audio.length; i++) if (active[i]) { sum += audio[i] * audio[i]; count++; }
      return Math.sqrt(sum / count);
    };
    const peakOf = () => audio.reduce((peak, value) => Math.max(peak, Math.abs(value)), 0);
    const target = 10 ** (targetDbfs / 20), current = activeRms();
    for (let i = 0; i < audio.length; i++) audio[i] = audio[i] * target / current;
    const limit = 10 ** (-1 / 20), peak = peakOf();
    if (peak > limit) for (let i = 0; i < audio.length; i++) audio[i] = audio[i] * limit / peak;
    return { rmsDb: 20 * Math.log10(activeRms()), peakDb: 20 * Math.log10(peakOf()) };
  }

  function toPcm(audio) {
    return Int16Array.from(audio, (value) => pyRound(Math.min(1, Math.max(-1, value)) * 32767));
  }

  function encodeWav(audio, sampleRate) {
    const pcm = toPcm(audio), view = new DataView(new ArrayBuffer(44 + 2 * pcm.length));
    const text = (at, value) => [...value].forEach((char, i) => view.setUint8(at + i, char.charCodeAt(0)));
    text(0, 'RIFF'); view.setUint32(4, 36 + 2 * pcm.length, true); text(8, 'WAVEfmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, 2 * sampleRate, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    text(36, 'data'); view.setUint32(40, 2 * pcm.length, true);
    pcm.forEach((value, i) => view.setInt16(44 + 2 * i, value, true));
    return view.buffer;
  }

  // ---- One stimulus -----------------------------------------------------------

  // Everything about a stimulus except its audio: note types, contours and timing.
  function outlineSong(data, options) {
    const song = data.songs[options.song], morph = song.morph, other = 1 - morph;
    const ratio = logRatio(data.profiles[morph], data.profiles[other]);
    const template = Array.from({ length: song.n }, (_, k) => song.first + k);
    // Average pitch of the recorded fragment, over all its contour samples.
    const fragmentPitch = mean(template.flatMap((i) => Array.from(data.contour(i))));
    const baseSequence = template.map((i) => data.cluster[i]);
    const baseScore = characteristicScore(baseSequence, ratio);

    let sequence = baseSequence, sources = template, target = null;
    if (options.treatment === 'maximized') {
      const counts = data.letters.map((_, type) => baseSequence.filter((cluster) => cluster === type).length);
      target = biasedMix(counts, data.profiles[morph], data.profiles[other], options.bias);
      sequence = biasSequence(baseSequence, apportion(target, song.n), options.seed);
      sources = chooseDonors(data, morph, sequence, template.map((i) => durationS(data.length[i])), template);
    }

    const notes = sources.map((source, k) => {
      const recorded = data.contour(source);
      const original = options.treatment === 'maximized'
        ? resizeContour(recorded, data.length[template[k]]) : recorded;
      let rendered = original;
      if (options.treatment === 'attenuated') {
        rendered = options.method === 'pca'
          ? pcReconstruct(original, options.pcs, data.pca)
          : attenuate(original, options.fm, options.sigma);
        if (options.flat) {
          const shift = fragmentPitch - mean(rendered);
          rendered = rendered.map((hz) => hz + shift);
        }
      }
      const sourceSong = data.songs[data.noteSong[source]];
      return {
        position: k + 1, cluster: sequence[k], source, replaced: source !== template[k], contour: rendered,
        sourceName: data.noteName(source), sourceBird: sourceSong.bird, sourceSong: sourceSong.name,
        sourceDuration: durationS(recorded.length),
        originalModulation: modulationRms(original), renderedModulation: modulationRms(rendered),
        meanPitch: mean(rendered),
      };
    });

    const rate = options.sampleRate;
    const plan = planTiming(notes.map((note) => noteSamples(note.contour, rate)), rate, options);
    notes.forEach((note, k) => {
      note.onset = plan.onsets[k];
      note.duration = noteSamples(note.contour, rate) / rate;
    });
    // With `join`, the silences between the notes of an attenuated fragment become glides.
    const joined = options.treatment === 'attenuated' && Boolean(options.join);
    const glides = !joined ? [] : notes.slice(1).map((note, k) => [
      [notes[k].onset + notes[k].duration, notes[k].contour[notes[k].contour.length - 1]], [note.onset, note.contour[0]]]);
    const total = (key) => notes.reduce((sum, note) => sum + note[key], 0);
    return {
      treatment: options.treatment, sampleRate: rate, plan, joined, glides,
      duration: plan.samples / rate, onsets: plan.onsets, notes,
      repeats: plan.repeats, period: plan.period / rate, fragments: plan.fragments,
      replaced: notes.filter((note) => note.replaced).length, fragmentPitch,
      sequence, target, baseScore, score: characteristicScore(sequence, ratio),
      meanModulation: total('renderedModulation') / notes.length,
      modulationRetained: total('renderedModulation') / total('originalModulation'),
      meanPitch: total('meanPitch') / notes.length,
    };
  }

  function renderSong(data, options) {
    const song = outlineSong(data, options);
    const mix = song.joined
      ? assemble([synthesizeWhistle(song.notes, song.plan, options.sampleRate, options.fade)], { ...song.plan, starts: [song.plan.starts[0]] })
      : assemble(song.notes.map((note) => synthesizeNote(note.contour, options.sampleRate, options.fade)), song.plan);
    return { ...song, audio: mix.audio, ...normalize(mix.audio, mix.active, options.level) };
  }

  return {
    FRAME_RATE, SAMPLE_RATE, SMOOTHING, MIN_NOTES, EXPERIMENT, decode, outlineSong, renderSong, synthesizeWhistle, encodeWav, toPcm, attenuate, gaussianSmooth,
    extendContour, pcScores, pcReconstruct, usageRatio, biasedProfile, leaning, profileLeaning, biasForLeaning,
    logRatio, characteristicScore,
    PRIOR_NOTES, biasedMix, apportion, biasSequence, mulberry32, chooseDonors, resizeContour, durationS,
  };
})();

/* Interface */
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', () => {
  const $ = (id) => document.getElementById(id);
  const embedded = $('lab-data').textContent.trim();
  if (!embedded) { document.body.classList.add('empty'); return; }
  const D = Lab.decode(JSON.parse(embedded));

  const svgNode = (tag, attributes = {}, text) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const htmlNode = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // ---- Note-type colours: the manuscript's repeating tab20 --------------------

  const TAB20 = ['#1f77b4', '#aec7e8', '#ff7f0e', '#ffbb78', '#2ca02c', '#98df8a', '#d62728', '#ff9896', '#9467bd', '#c5b0d5',
    '#8c564b', '#c49c94', '#e377c2', '#f7b6d2', '#7f7f7f', '#c7c7c7', '#bcbd22', '#dbdb8d', '#17becf', '#9edae5'];
  const isDark = () => document.documentElement.dataset.theme === 'dark';
  const channels = (hex) => [1, 3, 5].map((at) => parseInt(hex.slice(at, at + 2), 16));
  const luminance = (hex) => {
    const [r, g, b] = channels(hex).map((value) => value / 255)
      .map((value) => value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  // On the light surface the pale half of tab20 is darkened a little so thin lines stay visible.
  function typeColor(cluster) {
    const hex = TAB20[cluster % TAB20.length];
    if (isDark() || luminance(hex) < 0.42) return hex;
    return '#' + channels(hex).map((value) => Math.round(value * 0.8).toString(16).padStart(2, '0')).join('');
  }
  const inkOn = (hex) => luminance(hex) > 0.3 ? '#0b0b0b' : '#ffffff';

  // ---- State ------------------------------------------------------------------

  const MIN_NOTES = Lab.MIN_NOTES, E = Lab.EXPERIMENT;
  const FIELD = { bias: E.bias, seed: 20260920, fm: E.fm * 100, sigma: E.sigma, pcs: E.pcs, gap: E.gap, pause: E.pause,
    target: E.target, lead: E.lead, trail: E.trail, fade: E.fade, level: E.level };
  const CHOICES = { treatment: ['original', 'maximized', 'attenuated'], method: ['smooth', 'pca'] };
  const FORMER = { realistic: 'original', biased: 'maximized' };   // names used in older links
  const stem = (song) => song.name.replace(/\.wav$/i, '');
  const eligible = (song, morph) => song.n >= MIN_NOTES && (morph === undefined || song.morph === morph);

  // Own bias: the bias at which a drawn fragment would lean toward the form as much as this
  // recorded one does. 0 is the form's typical mix; fragments are ranked into thirds per form.
  const usageRatios = D.morphs.map((_, morph) => Lab.usageRatio(D.profiles[morph], D.profiles[1 - morph]));
  const THIRDS = ['upper', 'middle', 'lower'];
  const spectra = D.morphs.map((_, morph) => {
    const profile = D.profiles[morph], other = D.profiles[1 - morph], ratio = usageRatios[morph];
    const fragments = D.songs.map((song, index) => ({ song, index })).filter(({ song }) => eligible(song, morph))
      .map(({ song, index }) => {
        const sequence = Array.from({ length: song.n }, (_, k) => D.cluster[song.first + k]);
        return { index, bias: Lab.biasForLeaning(Lab.leaning(sequence, ratio), profile, other) };
      }).sort((a, b) => b.bias - a.bias);
    fragments.forEach((fragment, rank) => { fragment.third = Math.floor(rank * 3 / fragments.length); });
    // Where 90% of fragments of n notes would fall if drawn from the typical mix.
    const typical = Lab.profileLeaning(profile, ratio);
    const typicalRange = (n) => [-1, 1].map((side) =>
      Lab.biasForLeaning(typical.mean + side * 1.645 * typical.sd / Math.sqrt(n), profile, other));
    return { fragments, typicalRange };
  });
  const placeOf = (index) => spectra[D.songs[index].morph].fragments.find((fragment) => fragment.index === index);
  const signed = (value) => `${value < -0.05 ? '−' : value > 0.05 ? '+' : ''}${Math.abs(value).toFixed(1)}`;
  // Start on the fragment closest to the form's typical mix.
  const firstSong = (morph) => spectra[morph].fragments
    .reduce((best, fragment) => Math.abs(fragment.bias) < Math.abs(best.bias) ? fragment : best).index;
  const state = { song: firstSong(0), treatment: 'original', method: E.method, flat: E.flat, join: E.join, ...FIELD };

  const jumpToSets = location.hash === '#sets';   // old links to the separate sets page land here
  const clamp = (input, value) => Math.min(Number(input.max), Math.max(Number(input.min), value));
  (function readHash() {
    const query = new URLSearchParams(location.hash.slice(1));
    const song = D.songs.findIndex((item) => eligible(item) && item.name === query.get('song'));
    if (song >= 0) state.song = song;
    for (const [key, allowed] of Object.entries(CHOICES)) {
      const value = FORMER[query.get(key)] || query.get(key);
      if (allowed.includes(value)) state[key] = value;
    }
    state.flat = query.get('flat') === '1';
    state.join = query.get('join') === '1';
    for (const key of Object.keys(FIELD)) {
      const value = Number(query.get(key));
      if (query.has(key) && Number.isFinite(value)) state[key] = clamp($(key), value);
    }
  })();

  function writeHash() {
    const query = new URLSearchParams({ song: D.songs[state.song].name, treatment: state.treatment });
    if (state.treatment === 'attenuated') query.set('method', state.method);
    if (state.treatment === 'attenuated' && state.flat) query.set('flat', 1);
    if (state.treatment === 'attenuated' && state.join) query.set('join', 1);
    for (const key of Object.keys(FIELD)) if (state[key] !== FIELD[key]) query.set(key, state[key]);
    try { history.replaceState(null, '', '#' + query); } catch (error) { /* not allowed on some file:// setups */ }
  }

  // ---- Rendering --------------------------------------------------------------

  let current = null, reference = { key: '', song: null }, queued = false;
  const optionsFor = (treatment) => ({
    ...state, treatment, fm: state.fm / 100, sampleRate: Lab.SAMPLE_RATE,
  });

  function update() {
    stop();
    const key = ['song', 'gap', 'pause', 'target', 'lead', 'trail', 'fade', 'level'].map((name) => state[name]).join('|');
    if (reference.key !== key) reference = { key, song: Lab.renderSong(D, optionsFor('original')) };
    const ref = reference.song;
    current = { ref, out: state.treatment === 'original' ? ref : Lab.renderSong(D, optionsFor(state.treatment)) };
    syncControls();
    drawCharts();
    writeHash();
  }
  // Every fragment of the form as a dot on the bias scale; click one to select it.
  function drawSpectrum() {
    const { song, morph, other } = names(), { fragments, typicalRange } = spectra[song.morph], mine = placeOf(state.song);
    $('own-out').textContent = `${signed(mine.bias)} · ${THIRDS[mine.third]} third`;
    const svg = $('spectrum-chart'), tip = $('spectrum-tip');
    const width = Math.max(260, svg.parentNode.clientWidth), radius = 5, left = 8, right = width - 8;
    const all = spectra.flatMap((spectrum) => spectrum.fragments.map((fragment) => fragment.bias));
    const low = Math.floor(Math.min(...all, -1) * 2) / 2, high = Math.ceil(Math.max(...all, 1) * 2) / 2;
    const x = (bias) => left + (Math.min(high, Math.max(low, bias)) - low) / (high - low) * (right - left);

    // Stack dots that would overlap.
    const rows = [];
    const placed = [...fragments].sort((a, b) => a.bias - b.bias).map((fragment) => {
      const at = x(fragment.bias);
      let row = rows.findIndex((last) => at - last >= 2 * radius + 1);
      if (row < 0) row = rows.length;
      rows[row] = at;
      return { fragment, at, row };
    });
    const top = 20, base = top + rows.length * (2 * radius + 1) + 4, height = base + 38;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.replaceChildren();
    tip.hidden = true;

    const [from, to] = typicalRange(song.n).map(x);
    svg.append(svgNode('rect', { class: 'range', x: from, y: top - 4, width: to - from, height: base - top + 4, rx: 4 }));
    svg.append(svgNode('text', { class: 'tick', x: (from + to) / 2, y: 11, 'text-anchor': 'middle' }, 'typical range'));
    svg.append(svgNode('line', { class: 'axis-line', x1: left, x2: right, y1: base, y2: base }));
    for (let value = low; value <= high; value += 0.5) {
      svg.append(svgNode('line', { class: 'axis-line', x1: x(value), x2: x(value), y1: base, y2: base + 4 }));
      if (Number.isInteger(value)) {
        svg.append(svgNode('text', { class: 'tick', x: x(value), y: base + 17, 'text-anchor': 'middle' }, signed(value).replace('.0', '')));
      }
    }
    svg.append(svgNode('text', { class: 'tick', x: left, y: height - 3 }, `← more like ${other}`));
    svg.append(svgNode('text', { class: 'tick', x: right, y: height - 3, 'text-anchor': 'end' }, `more ${morph}-specific →`));

    const centre = (row) => base - radius - 2 - row * (2 * radius + 1);
    for (const { fragment, at, row } of placed) {
      const on = fragment.index === state.song;
      svg.append(svgNode('circle', { class: on ? 'spot on' : 'spot', cx: at, cy: centre(row), r: on ? radius + 1 : radius }));
    }
    for (const { fragment, at, row } of placed) {
      const pick = svgNode('circle', { class: 'pick', cx: at, cy: centre(row), r: radius + 2 });
      pick.addEventListener('click', () => { state.song = fragment.index; schedule(); });
      pick.addEventListener('pointerenter', () => showTip(tip, at, base + 8, [],
        `${stem(D.songs[fragment.index])} · ${D.songs[fragment.index].n} notes · ${signed(fragment.bias)}`));

  }

  function drawCharts() {
    drawSpectrum();
    drawTimeline();
    drawSong();
    drawProfile();
    drawTable();
  }
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }

  // ---- Controls ---------------------------------------------------------------

  const names = () => {
    const song = D.songs[state.song];
    return { song, morph: D.morphs[song.morph], other: D.morphs[1 - song.morph] };
  };
  const READOUT = {
    bias: (value) => value > 0 ? `${value}` : '0 · original',
    fm: (value) => `${value}%`,
    sigma: (value) => value > 0 ? `${value} frames · ${(value / Lab.FRAME_RATE * 1000).toFixed(0)} ms` : 'off',
    pcs: (value) => `${value} · ${D.pca.cumulative[value - 1].toFixed(1)}% of variance`,
  };

  function syncControls() {
    const { song } = names();
    for (const input of document.querySelectorAll('#morph input')) input.checked = Number(input.value) === song.morph;
    for (const key of Object.keys(CHOICES)) {
      for (const input of document.querySelectorAll(`#${key} input`)) input.checked = input.value === state[key];
    }
    for (const key of Object.keys(FIELD)) {
      if (document.activeElement !== $(key) || $(key).type === 'range') $(key).value = state[key];
      if (READOUT[key]) $(`${key}-out`).textContent = READOUT[key](state[key]);
    }
    $('song').value = state.song;

    $('flat').checked = state.flat;
    $('join').checked = state.join;
    $('flat-out').textContent = state.flat ? `${(current.out.fragmentPitch / 1000).toFixed(2)} kHz` : '';
    $('maximized-controls').hidden = state.treatment !== 'maximized';
    $('attenuated-controls').hidden = state.treatment !== 'attenuated';
    $('smooth-controls').hidden = state.method !== 'smooth';
    $('pca-controls').hidden = state.method !== 'pca';
    $('song-title').textContent = stem(song);
    $('play-ref').hidden = state.treatment === 'original';

    legend.replaceChildren();

      const item = htmlNode('span');
      item.append(htmlNode('span', 'key'), 'Original');
      legend.append(item);
    }
  }

  let songOrder = [];
  function fillSongs(morph) {
    const select = $('song'), name = D.morphs[morph];
    const labels = [`Upper third · most ${name}-specific`, 'Middle third', `Lower third · least ${name}-specific`];
    const groups = labels.map((label) => Object.assign(htmlNode('optgroup'), { label }));
    songOrder = [];
    for (const { index, third } of spectra[morph].fragments) {
      const song = D.songs[index];
      groups[third].append(Object.assign(htmlNode('option', '', `${stem(song)} · ${song.n} notes`), { value: index }));
      songOrder.push(index);
    }
    select.replaceChildren(...groups);
  }

  D.morphs.forEach((name, index) => {
    const label = htmlNode('label');
    label.append(Object.assign(htmlNode('input'), { type: 'radio', name: 'morph', value: index }), htmlNode('span', '', name));

    schedule();

  $('next').addEventListener('click', () => stepSong(1));
  for (const key of Object.keys(CHOICES)) {
    $(key).addEventListener('change', (event) => { state[key] = event.target.value; schedule(); });
  }
  for (const key of Object.keys(FIELD)) {

  $('join').addEventListener('change', (event) => { state.join = event.target.checked; schedule(); });


  // ---- Charts -----------------------------------------------------------------

  // rows: [key class, key colour or null, value, label]
  function showTip(tip, x, y, rows, heading) {
    tip.replaceChildren(htmlNode('div', 'tip-head', heading));
    for (const [keyClass, colour, value, label] of rows) {
      const row = htmlNode('div', 'tip-row'), key = htmlNode('span', keyClass);
      if (colour) key.style[keyClass.includes('bar') ? 'background' : 'borderColor'] = colour;
      row.append(key, htmlNode('b', '', value), label);
      tip.append(row);
    }
    tip.hidden = false;
    const room = tip.parentNode.clientWidth - tip.offsetWidth;
    tip.style.left = `${Math.max(0, Math.min(room, x + 14 > room ? x - 14 - tip.offsetWidth : x + 14))}px`;
    tip.style.top = `${Math.max(0, y)}px`;
