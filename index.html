  const niceStep = (span, target, steps) => steps.find((step) => span / step <= target) || steps[steps.length - 1];
  const KHZ = [2, 7], PLOT = { left: 42, right: 16 };
  // A chart's sub-title: its name in bold, then lighter detail.
  function rowLabel(x, y, name, detail) {
    const label = svgNode('text', { class: 'row-label', x, y }, name);
    if (detail) label.append(svgNode('tspan', { class: 'row-detail', dx: 10 }, detail));
    return label;
  }

  // Playback position is shown on both charts: { line, x(time) -> pixel or null }.
  const marks = { timeline: null, fragment: null };
  const trace = (note, x, y, shift = 0) => Array.from(note.contour, (hz, i) =>
    `${i ? 'L' : 'M'}${x(note.onset + shift + i / Lab.FRAME_RATE).toFixed(1)} ${y(hz).toFixed(1)}`).join('');

  // The glides that join the notes of a whistle, as one path.
  const glidePath = (song, x, y, shift = 0) => song.glides.map(([from, to]) =>
    `M${x(from[0] + shift).toFixed(1)} ${y(from[1]).toFixed(1)}L${x(to[0] + shift).toFixed(1)} ${y(to[1]).toFixed(1)}`).join('');

  // The whole stimulus: the fragment repeated, every repetition bracketed and numbered.
  function drawTimeline() {
    const { out } = current, svg = $('timeline-chart'), tip = $('timeline-tip');
    const width = Math.max(300, svg.parentNode.clientWidth), small = width < 520, height = 178;
    const box = { left: PLOT.left, right: width - PLOT.right, top: 68, bottom: height - 28 };
    const x = (time) => box.left + time / out.duration * (box.right - box.left);
    const y = (hz) => box.bottom - (hz / 1000 - KHZ[0]) / (KHZ[1] - KHZ[0]) * (box.bottom - box.top);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.replaceChildren();
    tip.hidden = true;

    svg.append(rowLabel(box.left, 14, 'Whole stimulus',
      `${out.repeats} fragment${out.repeats > 1 ? 's' : ''} · ${out.duration.toFixed(1)} s`));
    for (const khz of KHZ) {
      svg.append(svgNode('text', { class: 'tick', x: box.left - 10, y: y(khz * 1000) + 4, 'text-anchor': 'end' }, khz));
    }
    svg.append(svgNode('line', { class: 'axis-line', x1: box.left, x2: box.right, y1: box.bottom, y2: box.bottom }));
    const step = niceStep(out.duration, small ? 4 : 8, [1, 2, 5, 10, 15, 30, 60, 120]);
    for (let second = 0; second <= out.duration; second += step) {
      svg.append(svgNode('text', { class: 'tick', x: x(second), y: box.bottom + 20, 'text-anchor': 'middle' },
        second + step > out.duration ? `${second} s` : second));
    }

    const spans = out.fragments.map(([start, end]) => [x(start), x(end)]);
    const wide = spans[0][1] - spans[0][0] >= 80;
    spans.forEach(([start, end], r) => {
      svg.append(svgNode('rect', { class: r % 2 ? 'fragment alt' : 'fragment', x: start, y: box.top - 8, width: end - start, height: box.bottom - box.top + 8, rx: 4 }));
      svg.append(svgNode('path', { class: 'bracket', d: `M${start + 2} ${box.top - 13}v-6H${end - 2}v6` }));
      svg.append(svgNode('text', { class: 'frag-label', x: (start + end) / 2, y: box.top - 26 }, wide ? `Fragment ${r + 1}` : r + 1));
    });

    // One path per colour keeps the drawing light however many repetitions there are.
    const traces = new Map();
    for (const [start] of out.fragments) {
      for (const note of out.notes) {
        const colour = typeColor(note.cluster);
        traces.set(colour, (traces.get(colour) || '') + trace(note, x, y, start - out.fragments[0][0]));
      }
    }
    if (out.joined) {
      svg.append(svgNode('path', { class: 'line-glide thin', d: out.fragments.map(([start]) => glidePath(out, x, y, start - out.fragments[0][0])).join('') }));
    }
    for (const [colour, d] of traces) svg.append(svgNode('path', { class: 'line-mini', d, stroke: colour }));

    const cross = svgNode('line', { class: 'cross', y1: box.top - 8, y2: box.bottom, visibility: 'hidden' });
    const line = svgNode('line', { class: 'playhead', y1: box.top - 19, y2: box.bottom, visibility: 'hidden' });
    const hit = svgNode('rect', { x: box.left, y: 0, width: box.right - box.left, height, fill: 'transparent' });
    svg.append(cross, line, hit);
    marks.timeline = { line, x: (time) => time <= out.duration ? x(time) : null };
    hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
    hit.addEventListener('pointermove', (event) => {
      const at = Math.min(box.right, Math.max(box.left, event.clientX - svg.getBoundingClientRect().left));
      const time = (at - box.left) / (box.right - box.left) * out.duration;
      const r = out.fragments.findIndex(([start, end]) => time >= start && time <= end);
      cross.setAttribute('x1', at); cross.setAttribute('x2', at); cross.setAttribute('visibility', 'visible');
      showTip(tip, at, box.top - 8, [], `${r >= 0 ? `Fragment ${r + 1} of ${out.repeats}` : 'Silence'} · ${time.toFixed(1)} s`);
    });
  }

  // One fragment in detail: every repetition is identical.
  function drawSong() {
    const { ref, out } = current, compare = out !== ref;
    const svg = $('song-chart'), tip = $('song-tip');
    const width = Math.max(300, svg.parentNode.clientWidth), small = width < 520, height = small ? 314 : 410;
    const box = { left: PLOT.left, right: width - PLOT.right, top: 86, bottom: height - 30 };
    const [begin, finish] = out.fragments[0], pad = 0.06, span = finish - begin + 2 * pad;
    const x = (time) => box.left + (time - begin + pad) / span * (box.right - box.left);
    const y = (hz) => box.bottom - (hz / 1000 - KHZ[0]) / (KHZ[1] - KHZ[0]) * (box.bottom - box.top);

    // Type pills share one width: as wide as the two closest notes allow.
    const centres = out.notes.map((note) => x(note.onset + note.duration / 2));
    const closest = Math.min(...centres.slice(1).map((centre, k) => centre - centres[k]));
    const pill = Math.max(16, Math.min(30, closest - 3)), dense = pill < 24, pillTall = dense ? 18 : 24;

    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.classList.toggle('dense', dense);
    svg.replaceChildren();
    tip.hidden = true;

    svg.append(rowLabel(box.left, 14, 'One fragment', `${out.notes.length} notes · ${(finish - begin).toFixed(1)} s`));
    for (let khz = KHZ[0]; khz <= KHZ[1]; khz++) {
      svg.append(svgNode('line', {
        class: khz === KHZ[0] ? 'axis-line' : 'grid-line', x1: box.left, x2: box.right, y1: y(khz * 1000), y2: y(khz * 1000),
      }));
      svg.append(svgNode('text', { class: 'tick', x: box.left - 10, y: y(khz * 1000) + 4, 'text-anchor': 'end' }, khz));
    }
    svg.append(svgNode('text', { class: 'tick', x: box.left - 10, y: box.top - 14, 'text-anchor': 'end' }, 'kHz'));
    const step = niceStep(finish - begin, small ? 5 : 9, [0.1, 0.2, 0.25, 0.5, 1, 2, 5]);
    const ticks = Math.floor((finish - begin) / step + 1e-9);
    for (let k = 0; k <= ticks; k++) {
      const label = (k * step).toFixed(step < 0.5 ? 2 : 1).replace(/(\.\d)0$/, '$1');
      svg.append(svgNode('text', { class: 'tick', x: x(begin + k * step), y: box.bottom + 20, 'text-anchor': 'middle' },
        k === ticks ? `${label} s` : label));
    }

    const clip = svgNode('clipPath', { id: 'plot' });
    clip.append(svgNode('rect', { x: box.left, y: box.top - 8, width: box.right - box.left, height: box.bottom - box.top + 8 }));
    svg.append(clip);

    // Each note is one column in the colour of its type: a tinted band over its duration,
    // the contour, and a labelled pill on top.
    for (const note of out.notes) {
      const start = x(note.onset);
      svg.append(svgNode('rect', { class: 'band', x: start, y: box.top - 8, width: x(note.onset + note.duration) - start,
        height: box.bottom - box.top + 8, rx: 5, fill: typeColor(note.cluster) }));
    }
    if (compare) {
      svg.append(svgNode('path', { class: 'line-ref', d: ref.notes.map((note) => trace(note, x, y)).join(''), 'clip-path': 'url(#plot)' }));
    }
    if (out.joined) svg.append(svgNode('path', { class: 'line-glide', d: glidePath(out, x, y), 'clip-path': 'url(#plot)' }));
    out.notes.forEach((note, k) => {
      const colour = typeColor(note.cluster);
      svg.append(svgNode('path', { class: 'line-out', d: trace(note, x, y), stroke: colour, 'clip-path': 'url(#plot)' }));
      svg.append(svgNode('rect', { x: centres[k] - pill / 2, y: 60 - pillTall / 2, width: pill, height: pillTall, rx: dense ? 5 : 7, fill: colour }));
      svg.append(svgNode('text', { class: 'pill', x: centres[k], y: 60, fill: inkOn(colour) }, D.letters[note.cluster]));
      if (note.replaced) svg.append(svgNode('text', { class: 'was', x: centres[k], y: 36 }, D.letters[ref.notes[k].cluster]));
    });

    const cross = svgNode('line', { class: 'cross', y1: box.top - 8, y2: box.bottom, visibility: 'hidden' });
    const dotRef = svgNode('circle', { class: 'dot ref', r: 5, visibility: 'hidden' });
    const dotOut = svgNode('circle', { class: 'dot', r: 5, visibility: 'hidden' });
    const line = svgNode('line', { class: 'playhead', y1: box.top - 8, y2: box.bottom, visibility: 'hidden' });
    const hit = svgNode('rect', { x: box.left, y: 24, width: box.right - box.left, height: height - 24, fill: 'transparent' });
    svg.append(cross, dotRef, dotOut, line, hit);
    // During playback the marker runs through this view once per repetition.
    marks.fragment = { line, x: (time) => {
      if (time < begin) return null;
      const local = (time - begin) % out.period;
      return local <= finish - begin ? x(begin + local) : null;
    } };

    const hide = () => { for (const node of [cross, dotRef, dotOut]) node.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('pointermove', (event) => {
      const bounds = svg.getBoundingClientRect();
      const time = begin - pad + (event.clientX - bounds.left - box.left) / (box.right - box.left) * span;
      const distance = (note) => Math.max(note.onset - time, time - note.onset - note.duration, 0);
      const k = out.notes.reduce((best, note, i) => distance(note) < distance(out.notes[best]) ? i : best, 0);
      const note = out.notes[k], original = ref.notes[k], colour = typeColor(note.cluster);
      const frame = Math.min(note.contour.length - 1, Math.max(0, Math.round((time - note.onset) * Lab.FRAME_RATE)));
      const at = x(note.onset + frame / Lab.FRAME_RATE);
      cross.setAttribute('x1', at); cross.setAttribute('x2', at); cross.setAttribute('visibility', 'visible');
      const place = (dot, hz) => { dot.setAttribute('cx', at); dot.setAttribute('cy', y(hz)); dot.setAttribute('visibility', 'visible'); };
      place(dotOut, note.contour[frame]);
      dotOut.setAttribute('fill', colour);
      const khz = (hz) => `${(hz / 1000).toFixed(2)} kHz`;
      const lines = [['key', colour, khz(note.contour[frame]), compare ? state.treatment : '']];
      if (compare) { place(dotRef, original.contour[frame]); lines.push(['key', null, khz(original.contour[frame]), 'original']); }
      const type = D.letters[note.cluster], was = D.letters[original.cluster];
      showTip(tip, at, box.top, lines, `Note ${k + 1} · type ${type}${type !== was ? ` (was ${was})` : ''}`);
    });
  }

  // Note types ordered from most specific to each morph to most specific to the other.
  const typeOrder = usageRatios.map((ratio) => D.letters.map((_, i) => i).sort((a, b) => ratio[b] - ratio[a]));

  // Three aligned rows tell the bias: which note types the form favours, the notes of the
  // recorded fragment, and its notes once maximized.
  function drawProfile() {
    $('profile-card').hidden = state.treatment !== 'maximized';
    if (state.treatment !== 'maximized') return;
    const { ref, out } = current, { song, morph, other } = names();
    const typical = D.profiles[song.morph], contrast = D.profiles[1 - song.morph];
    const order = typeOrder[song.morph], ratio = usageRatios[song.morph];
    $('profile-other').textContent = `${other} usage`;
    const tally = (sequence) => sequence.reduce((map, type) => map.set(type, (map.get(type) || 0) + 1), new Map());
    const before = tally(ref.sequence), after = tally(out.sequence);

    const svg = $('profile-chart'), tip = $('profile-tip');
    const width = Math.max(300, svg.parentNode.clientWidth), small = width < 520;
    const box = { left: PLOT.left, right: width - PLOT.right }, tall = small ? 84 : 100;
    const most = Math.max(2, ...before.values(), ...after.values());
    const unit = Math.max(4, Math.min(12, Math.floor(120 / most))), stack = most * unit;
    const usage = { top: 30, bottom: 30 + tall };
    const strips = [
      { label: 'This fragment', counts: before, bottom: usage.bottom + 44 + stack },
      { label: `Maximized, bias ${state.bias}`, detail: `${out.replaced} of ${out.notes.length} notes replaced`, counts: after,
        bottom: usage.bottom + 2 * (44 + stack) },
    ];
    const floor = strips[1].bottom, height = floor + 66;
    const slot = (box.right - box.left) / order.length, bar = Math.min(26, slot - Math.min(3, slot / 4));
    const labelEvery = Math.ceil(10 / slot);
    const left = (rank) => box.left + rank * slot + (slot - bar) / 2;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.replaceChildren();
    tip.hidden = true;

    const wash = svgNode('rect', { class: 'wash', y: usage.top, width: slot, height: floor - usage.top, visibility: 'hidden' });
    svg.append(wash);

    // How often the form uses each type (bars) against the other form (ticks).
    const ceiling = Math.max(...typical, ...contrast) * 104, step = niceStep(ceiling, 3, [1, 2, 5, 10, 20, 50]);
    const y = (share) => usage.bottom - share * 100 / ceiling * tall;
    for (let value = 0; value <= ceiling; value += step) {
      svg.append(svgNode('line', { class: value ? 'grid-line' : 'axis-line', x1: box.left, x2: box.right, y1: y(value / 100), y2: y(value / 100) }));
      svg.append(svgNode('text', { class: 'tick', x: box.left - 10, y: y(value / 100) + 4, 'text-anchor': 'end' }, `${value}%`));
    }
    svg.append(rowLabel(box.left, usage.top - 12, `Typical ${morph} song`));
    order.forEach((type, rank) => {
      const size = usage.bottom - y(typical[type]), round = Math.min(4, bar / 2, size);
      if (size > 0.5) {
        svg.append(svgNode('path', { fill: typeColor(type), d:
          `M${left(rank)} ${usage.bottom}v${round - size}a${round} ${round} 0 0 1 ${round} ${-round}h${bar - 2 * round}a${round} ${round} 0 0 1 ${round} ${round}v${size - round}z` }));
      }
      svg.append(svgNode('line', { class: 'obs', x1: left(rank), x2: left(rank) + bar, y1: y(contrast[type]), y2: y(contrast[type]) }));
    });

    // The fragment's notes before and after, one block per note under its type.
    for (const strip of strips) {
      svg.append(svgNode('line', { class: 'axis-line', x1: box.left, x2: box.right, y1: strip.bottom, y2: strip.bottom }));
      svg.append(rowLabel(box.left, strip.bottom - stack - 12, strip.label, strip.detail));
      order.forEach((type, rank) => {
        for (let k = 0; k < (strip.counts.get(type) || 0); k++) {
          svg.append(svgNode('rect', { x: left(rank), y: strip.bottom - (k + 1) * unit, width: bar, height: Math.max(2, unit - 2), rx: Math.min(3, unit / 4), fill: typeColor(type) }));
        }
      });
    }
    order.forEach((type, rank) => {
      if (rank % labelEvery) return;
      const line = (rank / labelEvery) % 2;
      svg.append(svgNode('text', { class: 'type', x: left(rank) + bar / 2, y: floor + 17 + 15 * line }, D.letters[type]));
    });

    // Left of the divider the form uses a type more than the other form does.
    const split = order.findIndex((type) => ratio[type] < 1);
    if (split > 0) {
      const divide = box.left + split * slot;
      svg.append(svgNode('line', { class: 'axis-line', x1: divide, x2: divide, y1: usage.top, y2: floor + 38 }));
      svg.append(svgNode('text', { class: 'caption', x: (box.left + divide) / 2, y: height - 6 },
        small ? `More in ${morph}: boosted` : `Used more by ${morph} than ${other}: boosted`));
      svg.append(svgNode('text', { class: 'caption', x: (divide + box.right) / 2, y: height - 6 },
        small ? `Less: reduced` : `Used less: reduced`));
    }

    order.forEach((type, rank) => {
      const hit = svgNode('rect', { x: box.left + rank * slot, y: 0, width: slot, height, fill: 'transparent' });
      hit.addEventListener('pointerenter', () => {
        wash.setAttribute('x', box.left + rank * slot);
        wash.setAttribute('visibility', 'visible');
        const percent = (share) => `${(share * 100).toFixed(1)}%`;
        showTip(tip, left(rank) + bar, usage.top, [
          ['key bar', typeColor(type), percent(typical[type]), `typical ${morph}`],
          ['key obs', null, percent(contrast[type]), other],
          ['key none', null, `×${ratio[type].toFixed(1)}`, `${morph} ÷ ${other}`],
          ['key bar', typeColor(type), `${before.get(type) || 0} → ${after.get(type) || 0}`, 'notes in this fragment'],
        ], `Type ${D.letters[type]}`);
      });
      svg.append(hit);
    });
    svg.onpointerleave = () => { wash.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  }

  function drawTable() {
    const { ref, out } = current, table = $('notes');
    const redrawn = state.treatment === 'maximized', compare = out !== ref;
    const columns = [['#'], ['Type'], redrawn && ['Was'], ['Source note'], ['Length (ms)', 1], ['Pitch (Hz)', 1],
      ['Modulation (Hz)', 1], compare && ['Original (Hz)', 1]];
    const head = htmlNode('tr');
    for (const column of columns) if (column) head.append(htmlNode('th', column[1] ? 'num' : '', column[0]));
    table.replaceChildren(head, ...out.notes.map((note, k) => {
      const row = htmlNode('tr');
      const cells = [note.position, D.letters[note.cluster], D.letters[ref.notes[k].cluster], note.sourceName,
        (note.duration * 1000).toFixed(0), note.meanPitch.toFixed(0),
        note.renderedModulation.toFixed(0), ref.notes[k].renderedModulation.toFixed(0)];
      cells.forEach((text, c) => {
        if (!columns[c]) return;
        const cell = htmlNode('td', columns[c][1] ? 'num' : c === 3 ? 'source' : '', text);
        if (c === 1) cell.prepend(Object.assign(htmlNode('span', 'swatch'), { style: `background:${typeColor(note.cluster)}` }));
        row.append(cell);
      });
      return row;
    }));
  }

  // ---- Playback and export ----------------------------------------------------

  // One sound at a time. `marks` returns the position markers to move while it plays.
  const player = { context: null, source: null, button: null, started: 0, marks: () => [] };
  function stop() {
    if (player.source) { player.source.onended = null; player.source.stop(); }
    if (player.button) player.button.classList.remove('playing');
    for (const mark of player.marks()) if (mark) mark.line.setAttribute('visibility', 'hidden');
    player.source = player.button = null;
  }
  function play(song, button, marksNow) {
    stop();
    player.context = player.context || new AudioContext();
    player.context.resume();
    const buffer = player.context.createBuffer(1, song.audio.length, song.sampleRate);
    buffer.getChannelData(0).set(song.audio);
    player.source = player.context.createBufferSource();
    player.source.buffer = buffer;
    player.source.connect(player.context.destination);
    player.source.onended = stop;
    player.source.start();
    player.started = player.context.currentTime;
    player.button = button;
    player.marks = marksNow;
    button.classList.add('playing');
    (function follow() {
      if (!player.source) return;
      const time = player.context.currentTime - player.started;
      for (const mark of player.marks()) {
        if (!mark) continue;
        const at = mark.x(time);
        mark.line.setAttribute('visibility', at === null ? 'hidden' : 'visible');
        if (at !== null) { mark.line.setAttribute('x1', at); mark.line.setAttribute('x2', at); }
      }
      requestAnimationFrame(follow);
    })();
  }
  // The lab's two buttons: pressing the one that is playing stops it.
  const labMarks = () => Object.values(marks);
  const toggleLab = (which, button) => (player.button === button ? stop() : play(current[which], button, labMarks));
  $('play-out').addEventListener('click', (event) => toggleLab('out', event.currentTarget));
  $('play-ref').addEventListener('click', (event) => toggleLab('ref', event.currentTarget));
  function fileStem() {
    const { song, morph } = names();
    const tag = {
      original: 'original',
      maximized: `maximized_bias${state.bias}_seed${state.seed}`,
      attenuated: (state.method === 'pca' ? `attenuated_pc${state.pcs}` : `attenuated_keep${state.fm}_sigma${state.sigma}`)
        + (state.join ? '_whistle' : '')
        + (state.flat ? '_samepitch' : ''),
    }[state.treatment];
    return `${morph}_${stem(song)}_${tag}_${Math.round(current.out.duration)}s`;
  }
  // ---- Stimulus sets ----------------------------------------------------------

  // A set is four stimuli for the experiment, each built on a fragment drawn at random within
  // its form, always with the experiment's settings (whatever the lab above is showing).
  const RECIPE = [
    { treatment: 'original', form: 'LBHB', detail: 'as recorded' },
    { treatment: 'original', form: 'HIGH', detail: 'as recorded' },
    { treatment: 'maximized', form: 'HIGH', detail: `bias ${E.bias}` },
    { treatment: 'attenuated', form: 'LBHB', detail: `${Math.round(E.fm * 100)}% modulation kept` },
  ];
  const capital = (word) => word[0].toUpperCase() + word.slice(1);
  const pool = (form) => D.songs.map((song, index) => index).filter((index) => eligible(D.songs[index], D.morphs.indexOf(form)));
  const dice = (below) => Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * below);
  const folder = (set) => `set${String(set.number).padStart(2, '0')}`;
  // Files of a set start with their place in its order, so they sort the way they are played.
  const fileName = (item, set) => `${set.ordered ? `${set.items.indexOf(item) + 1}_` : ''}`
    + `${item.treatment}_${item.form}_${item.fragment.replace(/\.wav$/i, '')}.wav`;
  // A set carries the settings it was generated with, so it can always be rebuilt as it was.
  const EARLIER = { pause: 65, target: 30 };   // sets saved before settings were recorded
  const settingsOf = (set) => set.settings || { ...E, ...EARLIER };
  function optionsOf(item, set) {
    const song = D.songs.findIndex((entry) => entry.name === item.fragment);
    if (song < 0) throw new Error(`Fragment ${item.fragment} is not in this page's data.`);
    return { ...settingsOf(set), song, treatment: item.treatment, seed: set.seed };
  }

  // The list is kept in this browser. A new set takes the lowest number that is free, so
  // the numbers of deleted sets are filled again.
  const STORE = 'stimulus-sets';
  let sets = [];
  try {
    sets = JSON.parse(localStorage.getItem(STORE)) || [];
    localStorage.removeItem(`${STORE}-highest`);   // left by an earlier version of this page
    for (const set of sets) {
      // An earlier version noted one hour per set: give it to each of its playbacks.
      if (!set.session || !set.session.hour) continue;
      for (const item of set.items) item.observed = { hour: set.session.hour, ...item.observed };
      delete set.session.hour;
    }
  } catch (error) { /* storage unavailable */ }
  const remember = () => {
    try {
      localStorage.setItem(STORE, JSON.stringify(sets));
      localStorage.setItem(`${STORE}-changed`, new Date().toISOString());
    } catch (error) { /* storage unavailable */ }
  };
  function freeNumber() {
    const taken = new Set(sets.map((set) => set.number));
    let number = 1;
    while (taken.has(number)) number++;
    return number;
  }

  // Two stimuli of the same form never share a fragment within a set.
  function drawSet() {
    const taken = new Set();
    const items = RECIPE.map(({ treatment, form }) => {
      const free = pool(form).filter((index) => !taken.has(index));
      const index = free[dice(free.length)];
      taken.add(index);
      return { treatment, form, fragment: D.songs[index].name };
    });
    // The four stimuli are then put in a random order: the order in which to play them.
    for (let i = items.length - 1; i > 0; i--) {
      const j = dice(i + 1);
      [items[i], items[j]] = [items[j], items[i]];
    }
    const set = { number: freeNumber(), created: new Date().toISOString(), seed: dice(1e9), settings: { ...E }, ordered: true, items };
    for (const item of items) {
      const out = Lab.outlineSong(D, optionsOf(item, set));
      Object.assign(item, { bird: D.songs[optionsOf(item, set).song].bird, notes: out.notes.length, seconds: out.duration, replaced: out.replaced });
    }
    return set;
  }

  const crcTable = Uint32Array.from({ length: 256 }, (_, n) => {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    return c >>> 0;
  });
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // A ZIP archive whose entries are stored uncompressed.
  function zip(files, date) {
    const encoder = new TextEncoder(), parts = [], directory = [];
    const time = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
    const day = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    let offset = 0;
    for (const file of files) {
      const name = encoder.encode(file.name), crc = crc32(file.bytes), size = file.bytes.length;
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
      local.setUint16(10, time, true); local.setUint16(12, day, true); local.setUint32(14, crc, true);
      local.setUint32(18, size, true); local.setUint32(22, size, true); local.setUint16(26, name.length, true);
      parts.push(local.buffer, name, file.bytes);
      const entry = new DataView(new ArrayBuffer(46));
      entry.setUint32(0, 0x02014b50, true); entry.setUint16(4, 20, true); entry.setUint16(6, 20, true); entry.setUint16(8, 0x0800, true);
      entry.setUint16(12, time, true); entry.setUint16(14, day, true); entry.setUint32(16, crc, true);
      entry.setUint32(20, size, true); entry.setUint32(24, size, true); entry.setUint16(28, name.length, true);
      entry.setUint32(42, offset, true);
      directory.push(entry.buffer, name);
      offset += 30 + name.length + size;
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, directory.reduce((sum, part) => sum + part.byteLength, 0), true); end.setUint32(16, offset, true);
    return [...parts, ...directory, end.buffer];
  }

  // The four WAV files and a manifest, in one folder named after the set.
  function archive(set) {
    const files = [], described = [], used = settingsOf(set);
    for (const item of set.items) {
      const out = Lab.renderSong(D, optionsOf(item, set));
      files.push({ name: `${folder(set)}/${fileName(item, set)}`, bytes: new Uint8Array(Lab.encodeWav(out.audio, out.sampleRate)) });
      described.push({
        file: fileName(item, set), position: set.items.indexOf(item) + 1, treatment: item.treatment, form: item.form, song_fragment: item.fragment, bird: item.bird,
        n_notes: out.notes.length, n_fragments: out.repeats, duration_s: out.duration,
        note_types: out.sequence.map((type) => D.letters[type]),
        ...(item.treatment === 'maximized' && { bias: used.bias, seed: set.seed, notes_replaced: out.replaced }),
        ...(item.treatment === 'attenuated' && {
          method: 'smooth and scale', modulation_kept: used.fm, smoothing_sigma_frames: used.sigma, same_pitch_for_all_notes: used.flat }),
      });
    }
    const description = {
      set: set.number, created: set.created, files: described,
      settings: { minimum_fragment_notes: MIN_NOTES, note_gap_ms: used.gap, fragment_gap_ms: used.pause, target_duration_s: used.target,
        lead_ms: used.lead, trail_ms: used.trail, fade_ms: used.fade, active_rms_dbfs: used.level, sample_rate_hz: used.sampleRate },
      data: D.meta,
    };
    files.push({ name: `${folder(set)}/${folder(set)}.json`, bytes: new TextEncoder().encode(JSON.stringify(description, null, 2) + '\n') });
    return zip(files, new Date(set.created));
  }
  // Let the button repaint before the audio is computed.
  const later = (work) => new Promise((resolve) => setTimeout(() => resolve(work()), 30));

  // Bring one stimulus of a set into the lab above, with the settings of its set.
  function showInLab(item, set) {
    const options = optionsOf(item, set);
    Object.assign(state, {
      song: options.song, treatment: item.treatment, method: options.method, flat: options.flat, join: Boolean(options.join), seed: set.seed,
      bias: options.bias, fm: options.fm * 100, sigma: options.sigma, pcs: options.pcs, gap: options.gap, pause: options.pause,
      target: options.target, lead: options.lead, trail: options.trail, fade: options.fade, level: options.level,
    });
    fillSongs(D.songs[options.song].morph);
    schedule();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // One fragment of a stimulus at a glance: its notes in their type colours.
  function drawMini(svg, out) {
    const width = Math.max(160, svg.parentNode.clientWidth), height = 118;
    const box = { left: 20, right: width - 2, top: 8, bottom: height - 18 };
    const [begin, finish] = out.fragments[0];
    const x = (time) => box.left + (time - begin) / (finish - begin) * (box.right - box.left);
    const y = (hz) => box.bottom - (hz / 1000 - KHZ[0]) / (KHZ[1] - KHZ[0]) * (box.bottom - box.top);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.replaceChildren();
    svg.append(svgNode('line', { class: 'axis-line', x1: box.left, x2: box.right, y1: box.bottom, y2: box.bottom }));
    for (const khz of KHZ) svg.append(svgNode('text', { class: 'tick', x: box.left - 6, y: y(khz * 1000) + 4, 'text-anchor': 'end' }, khz));
    svg.append(svgNode('text', { class: 'tick', x: box.left, y: height - 3 }, '0'));
    svg.append(svgNode('text', { class: 'tick', x: box.right, y: height - 3, 'text-anchor': 'end' }, `${(finish - begin).toFixed(1)} s`));
    for (const note of out.notes) {
      const start = x(note.onset);
      svg.append(svgNode('rect', { class: 'band', x: start, y: box.top - 4, width: x(note.onset + note.duration) - start,
        height: box.bottom - box.top + 4, rx: 3, fill: typeColor(note.cluster) }));
    }
    if (out.joined) svg.append(svgNode('path', { class: 'line-glide small', d: glidePath(out, x, y) }));
    for (const note of out.notes) svg.append(svgNode('path', { class: 'line-small', d: trace(note, x, y), stroke: typeColor(note.cluster) }));
    // While this stimulus plays, the marker runs through the fragment once per repetition.
    const line = svgNode('line', { class: 'playhead', y1: box.top - 4, y2: box.bottom, visibility: 'hidden' });
    svg.append(line);
    return { line, x: (time) => {
      if (time < begin) return null;
      const local = (time - begin) % out.period;
      return local <= finish - begin ? x(begin + local) : null;
    } };
  }

  const outlines = new Map();
  function outlineOf(item, set) {
    const key = [set.number, set.created, item.fragment, item.treatment].join('|');
    if (!outlines.has(key)) outlines.set(key, Lab.outlineSong(D, optionsOf(item, set)));
    return outlines.get(key);
  }

  // What is noted for each playback once the stimulus has been played in the field.
  const OBSERVED = [
    { key: 'time', label: 'Time spent < 1 m' },
    { key: 'max1', label: 'Max obs 1 m' },
    { key: 'max2', label: 'Max obs 2 m' },
    { key: 'max5', label: 'Max obs 5 m' },
    { key: 'comments', label: 'Comments' },
  ];
  // A whole number from a field, or nothing while it is empty.
  const whole = (input, most) => {
    if (input.value.trim() === '') return null;
    const value = Math.min(most, Math.max(0, Math.round(Number(input.value))));
    return Number.isFinite(value) ? value : null;
  };
  const isNoted = (item) => {
    const noted = item.observed || {};
    return ['hour', 'minutes', 'seconds', 'max1', 'max2', 'max5'].some((key) => noted[key] != null && noted[key] !== '')
      || Boolean((noted.comments || '').trim());
  };
  const notedIn = (set) => set.items.filter(isNoted).length;
  const dayTime = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

  // A short message about what just happened, shown for a few seconds.
  let fading = 0;
  function notify(text, lasting = 5000) {
    $('status').textContent = text;
    $('status').hidden = false;
    clearTimeout(fading);
    fading = setTimeout(() => { $('status').hidden = true; }, lasting);
  }
  const labelled = (className, path, text) => {
    const button = Object.assign(htmlNode('button', className), { type: 'button' }), picture = svgNode('svg', { class: 'ico', viewBox: '0 0 24 24' });
    picture.append(svgNode('path', { d: path }));
    button.append(picture, htmlNode('span', '', text));
    return button;
  };

  // Only one set is on screen at a time. `shown` is its number; without one, the latest set.
  let shown = null;
  function drawSets() {
    const list = $('set-list'), pending = [];
    if (player.button && list.contains(player.button)) stop();
    list.replaceChildren();
    const ordered = [...sets].sort((a, b) => a.number - b.number);
    if (sets.length && !ordered.some((set) => set.number === shown)) {
      shown = sets.reduce((latest, set) => (set.created > latest.created ? set : latest)).number;
    }
    const place = ordered.findIndex((set) => set.number === shown);
    $('pager').hidden = !sets.length;
    $('set-prev').disabled = place <= 0;
    $('set-next').disabled = place < 0 || place >= ordered.length - 1;
    $('set-tabs').replaceChildren(...ordered.map((set) => {
      const tab = Object.assign(htmlNode('button', 'tab', set.number), { type: 'button' });
      tab.dataset.tab = set.number;
      tab.setAttribute('aria-pressed', set.number === shown);
      tab.addEventListener('click', () => { shown = set.number; drawSets(); });
      return tab;
    }));
    if (!sets.length) {
      const blank = htmlNode('div', 'card blank');
      blank.append(htmlNode('b', '', 'No set yet'), htmlNode('span', '', 'Press “New set” to draw four stimuli at random.'));
      list.append(blank);
    }

    for (const set of ordered.filter((one) => one.number === shown)) {
      const card = htmlNode('article', 'card'), head = htmlNode('div', 'card-head'), name = htmlNode('div', 'set-name');
      card.dataset.set = set.number;
      name.append(htmlNode('h3', 'title', `Set ${set.number}`), htmlNode('span', 'meta progress'));

      const save = labelled('btn', 'M12 4v11M7 11l5 5 5-5M5 20h14', 'Download sounds');
      save.title = `The four sound files of set ${set.number}, as ${folder(set)}.zip`;
      save.addEventListener('click', async () => {
        save.disabled = true;
        save.lastChild.textContent = 'Preparing…';
        try {
          download(`${folder(set)}.zip`, await later(() => archive(set)), 'application/zip');
          notify(`Sounds of set ${set.number} downloaded as ${folder(set)}.zip`);
        } catch (error) {
          notify(`Could not prepare set ${set.number}: ${error.message}`);
        }
        save.disabled = false;
        save.lastChild.textContent = 'Download sounds';
      });
      head.append(name, save);

      // When and where the set was played.
      const session = htmlNode('div', 'session'), when = set.session || (set.session = {});
      const place = (key, label, attributes) => {
        const field = htmlNode('label', '', label), input = Object.assign(htmlNode('input'), attributes, { value: when[key] ?? '' });
        input.addEventListener('input', () => { when[key] = input.value === '' ? null : input.type === 'number' ? Number(input.value) : input.value; remember(); refreshStatus(); });
        field.append(input);
        session.append(field);
        return input;
      };
      const date = place('date', 'Date', { type: 'date' });
      const latitude = place('latitude', 'Latitude', { type: 'number', step: 'any', min: -90, max: 90, placeholder: '-21.11510' });
      const longitude = place('longitude', 'Longitude', { type: 'number', step: 'any', min: -180, max: 180, placeholder: '55.53640' });
      const fill = (input, value) => { input.value = value; input.dispatchEvent(new Event('input')); };
      // Pasting "latitude, longitude" in either box fills both.
      for (const input of [latitude, longitude]) {
        input.addEventListener('paste', (event) => {
          const pair = event.clipboardData.getData('text').trim().match(/^(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)$/);
          if (!pair) return;
          event.preventDefault();
          fill(latitude, pair[1].replace(',', '.'));
          fill(longitude, pair[2].replace(',', '.'));
        });
      }
      const here = Object.assign(htmlNode('button', 'quiet', 'Use my position'), { type: 'button', title: 'Fill in the coordinates of this device' });
      here.addEventListener('click', () => {
        if (!navigator.geolocation) { notify('This browser cannot give its position: type the coordinates'); return; }
        // Without a network a GPS receiver can need a minute to find itself, so wait that long.
        notify('Looking for the position…', 60000);
        navigator.geolocation.getCurrentPosition((position) => {
          fill(latitude, position.coords.latitude.toFixed(6));
          fill(longitude, position.coords.longitude.toFixed(6));
          notify(`Position noted, accurate to about ${Math.round(position.coords.accuracy)} m`);
        }, (problem) => notify(problem.code === 1
          ? 'Location is not allowed for this page: allow it in the browser, or type the coordinates'
          : 'No position found. Without internet this needs a device with GPS and a clear view of the sky: type the coordinates', 9000),
        { enableHighAccuracy: true, timeout: 60000 });
      });
      const quick = htmlNode('div', 'quick');
      quick.append(here);
      session.append(quick);

      // One playback per row, in the order of the set, with the fields to fill in afterwards.
      const table = htmlNode('table', 'set-table'), top = htmlNode('tr');
      for (const label of ['Playback', 'Hour', ...OBSERVED.map((column) => column.label)]) top.append(htmlNode('th', '', label));
      table.append(top);
      set.items.forEach((item, position) => {
        const row = htmlNode('tr'), noted = item.observed || (item.observed = {});
        const keep = (key, value) => { noted[key] = value; remember(); refreshStatus(); };

        // Play this stimulus as it will be exported; pressing again stops it.
        let mark = null;
        const listen = Object.assign(htmlNode('button', 'btn round'), { type: 'button', title: 'Play this stimulus' });
        listen.setAttribute('aria-label', `Play stimulus ${position + 1} of set ${set.number}`);
        for (const [shape, d] of [['go', 'M1 0l8 5-8 5z'], ['stop', 'M1 1h8v8H1z']]) {
          const picture = svgNode('svg', { class: shape, viewBox: '0 0 10 10' });
          picture.append(svgNode('path', { d }));
          listen.append(picture);
        }
        listen.addEventListener('click', () => {
          if (player.button === listen) { stop(); return; }
          try {
            play(Lab.renderSong(D, optionsOf(item, set)), listen, () => [mark]);
          } catch (error) {
            notify(`Could not play this stimulus: ${error.message}`);
            return;
          }
          // The first time a playback is played, its hour is noted, and the date of the set if
          // it is still empty. Playing it again changes nothing: clear the box to note it anew.
          if (noted.hour) return;
          const moment = new Date(), two = (part) => String(part).padStart(2, '0');
          stamp.value = `${two(moment.getHours())}:${two(moment.getMinutes())}`;
          keep('hour', stamp.value);
          if (!when.date) fill(date, `${moment.getFullYear()}-${two(moment.getMonth() + 1)}-${two(moment.getDate())}`);
        });
        const stamp = Object.assign(htmlNode('input'), { type: 'time', value: noted.hour ?? '' });
        stamp.setAttribute('aria-label', `Hour of playback ${position + 1} of set ${set.number}`);
        stamp.addEventListener('input', () => keep('hour', stamp.value || null));
        const open = Object.assign(htmlNode('button', 'stimulus-open'), { type: 'button', title: 'Show this stimulus in the lab above' });
        open.append(htmlNode('b', '', `${capital(item.treatment)} ${item.form}`),
          htmlNode('span', 'meta', `${item.fragment.replace(/\.wav$/i, '')} · ${item.notes}\u00a0notes · ${item.seconds.toFixed(1)}\u00a0s`
            + (item.treatment === 'maximized' ? ` · ${item.replaced}\u00a0replaced` : '')));
        open.addEventListener('click', () => showInLab(item, set));
        const wrap = htmlNode('div', 'chart-wrap');
        const svg = svgNode('svg', { class: 'chart', role: 'img', 'aria-label': `Notes of the ${item.treatment} ${item.form} stimulus` });
        wrap.append(svg);
        const stimulus = htmlNode('td', 'stimulus'), lead = htmlNode('div', 'stimulus-head');
        lead.append(htmlNode('span', 'order', position + 1), listen, open);
        stimulus.append(lead, wrap);
        row.append(stimulus);
        pending.push(() => {
          try {
            mark = drawMini(svg, outlineOf(item, set));
          } catch (error) {
            wrap.replaceChildren(htmlNode('span', 'meta', error.message));
          }
        });

        const started = htmlNode('td');
        started.append(stamp);
        started.dataset.label = 'Hour';
        row.append(started);

        // Time as minutes and seconds.
        const time = htmlNode('td'), clock = htmlNode('div', 'clock');
        const minutes = Object.assign(htmlNode('input'), { type: 'number', min: 0, step: 1, value: noted.minutes ?? '' });
        const seconds = Object.assign(htmlNode('input'), { type: 'number', min: 0, max: 59, step: 1, value: noted.seconds ?? '' });
        minutes.setAttribute('aria-label', `Minutes spent under 1 m, playback ${position + 1} of set ${set.number}`);
        seconds.setAttribute('aria-label', `Seconds spent under 1 m, playback ${position + 1} of set ${set.number}`);
        for (const [input, key, most] of [[minutes, 'minutes', 999], [seconds, 'seconds', 59]]) {
          input.addEventListener('input', () => keep(key, whole(input, most)));
          input.addEventListener('change', () => { input.value = noted[key] ?? ''; });
        }
        clock.append(minutes, htmlNode('span', '', 'min'), seconds, htmlNode('span', '', 's'));
        time.append(clock);
        time.dataset.label = OBSERVED[0].label;
        row.append(time);

        // Largest number of birds seen within each distance: whole numbers.
        for (const column of OBSERVED.slice(1, 4)) {
          const cell = htmlNode('td'), input = Object.assign(htmlNode('input'), { type: 'number', min: 0, step: 1, value: noted[column.key] ?? '' });
          input.setAttribute('aria-label', `${column.label}, playback ${position + 1} of set ${set.number}`);
          input.addEventListener('input', () => keep(column.key, whole(input, 9999)));
          input.addEventListener('change', () => { input.value = noted[column.key] ?? ''; });
          cell.append(input);
          cell.dataset.label = column.label;
          row.append(cell);
        }

        const comments = htmlNode('td', 'comments'), text = Object.assign(htmlNode('textarea'), { rows: 2, value: noted.comments ?? '' });
        text.setAttribute('aria-label', `Comments, playback ${position + 1} of set ${set.number}`);
        text.addEventListener('input', () => keep('comments', text.value));
        comments.append(text);
        comments.dataset.label = 'Comments';
        row.append(comments);
        table.append(row);
      });

      // Deleting sits apart from the everyday actions, and asks first.
      const foot = htmlNode('div', 'set-foot');
      const remove = Object.assign(htmlNode('button', 'quiet danger', 'Delete this set'), { type: 'button', title: `Remove set ${set.number} and what was noted for it` });
      const sure = htmlNode('span', 'sure'), yes = Object.assign(htmlNode('button', 'quiet', 'Yes'), { type: 'button' });
      const no = Object.assign(htmlNode('button', 'quiet', 'No'), { type: 'button' });
      sure.append(htmlNode('span', 'quiet', `Delete set ${set.number} and its notes?`), yes, no);
      sure.hidden = true;
      remove.addEventListener('click', () => { sure.hidden = false; remove.hidden = true; });
      no.addEventListener('click', () => { sure.hidden = true; remove.hidden = false; });
      yes.addEventListener('click', () => {
        // After a deletion, show the neighbouring set.
        const rest = [...sets].filter((other) => other !== set).sort((a, b) => a.number - b.number);
        const next = rest.find((other) => other.number > set.number) || rest[rest.length - 1];
        sets = rest;
        shown = next ? next.number : null;
        remember();
        drawSets();
        notify(`Set ${set.number} deleted`);
      });
      foot.append(remove, sure);
      card.append(head, session, table, foot);
      list.append(card);
    }
    for (const draw of pending) draw();
    refreshStatus();
  }

  // What changes while typing: the marks on the set buttons, the progress of the set on
  // screen, and the state of the data.
  function refreshStatus() {
    for (const tab of $('set-tabs').children) {
      const set = sets.find((one) => one.number === Number(tab.dataset.tab)), count = notedIn(set);
      tab.classList.toggle('some', count > 0 && count < set.items.length);
      tab.classList.toggle('done', count === set.items.length);
      tab.title = `Set ${set.number} · ${count} of ${set.items.length} playbacks noted`;
    }
    const current = sets.find((one) => one.number === shown), progress = document.querySelector('#set-list .progress');
    if (current && progress) {
      progress.textContent = `Generated ${dayTime(current.created)} · ${notedIn(current)} of ${current.items.length} playbacks noted`;
    }
    const playbacks = sets.reduce((sum, set) => sum + set.items.length, 0), noted = sets.reduce((sum, set) => sum + notedIn(set), 0);
    $('data-summary').textContent = sets.length
      ? `${plural(sets.length, 'set')} · ${noted} of ${playbacks} playbacks noted. Stored in this browser only.`
      : 'Sets and what you note are stored in this browser only.';
    let changed = null, saved = null;
    try { changed = localStorage.getItem(`${STORE}-changed`); saved = localStorage.getItem(`${STORE}-saved`); } catch (error) { /* storage unavailable */ }
    const upToDate = Boolean(saved) && (!changed || saved >= changed);
    $('backup').hidden = !sets.length;
    $('backup').className = upToDate ? 'backup good' : 'backup';
    $('backup').textContent = upToDate ? `Downloaded ${dayTime(saved)}` : saved ? `Changed since the download of ${dayTime(saved)}` : 'Not downloaded yet';
    $('export').disabled = !sets.length;
    if ($('confirm').hidden) $('clear').hidden = !sets.length;
  }

  const TAIL = `in a random order, at least ${E.target} s each`;
  for (const item of RECIPE) {
    const tag = htmlNode('span', 'tag', `${capital(item.treatment)} ${item.form}`);
    if (item.treatment !== 'original') tag.append(htmlNode('small', '', item.detail));
    $('recipe').append(tag);
  }
  $('recipe').append(TAIL);
  $('recipe').title = `Each stimulus is a random fragment of ${MIN_NOTES} notes or more `
    + `(${[...new Set(RECIPE.map((item) => item.form))].map((form) => `${pool(form).length} ${form}`).join(', ')}), `
    + `repeated to at least ${E.target} s, with ${E.gap} ms between notes and ${E.pause} ms between fragments.`;

  // A new set is only added to the row of sets. Nothing is downloaded until asked.
  $('generate').addEventListener('click', () => {
    try {
      const set = drawSet();
      sets.push(set);
      shown = set.number;
      remember();
      drawSets();
      notify(`Set ${set.number} created`);
      document.querySelector(`[data-set="${set.number}"]`).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } catch (error) {
      notify(`Could not create a set: ${error.message}`);
    }
  });
  const step = (by) => {
    const numbers = sets.map((set) => set.number).sort((a, b) => a - b), at = numbers.indexOf(shown) + by;
    if (at < 0 || at >= numbers.length) return;
    shown = numbers[at];
    drawSets();
  };
  $('set-prev').addEventListener('click', () => step(-1));
  $('set-next').addEventListener('click', () => step(1));

  // The data entered by hand, one row per playback: which set and file, the treatment, and
  // what was noted. The last columns say how the stimulus was made, so that the file can
  // also bring everything back with "Import data".
  $('export').addEventListener('click', () => {
    const quote = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
    const columns = ['set', 'order', 'file_name', 'treatment', 'form', 'date', 'hour', 'latitude', 'longitude',
      'time_spent_under_1m', 'time_spent_under_1m_seconds', 'max_obs_1m', 'max_obs_2m', 'max_obs_5m', 'comments',
      'song_fragment', 'bird', 'notes', 'stimulus_seconds', 'generated', 'maximized_bias', 'seed', 'attenuated_modulation_kept',
      'note_gap_ms', 'fragment_gap_ms', 'target_seconds', 'settings_json'];
    const lines = [...sets].sort((a, b) => a.number - b.number).flatMap((set) => set.items.map((item, position) => {

  // Rows of a CSV file, with quoted fields that may hold separators, quotes and line breaks.
  function parseCsv(text, separator) {
    const rows = [[]];
    let field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c !== '"') field += c;
        else if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else if (c === '"') quoted = true;
      else if (c === separator) { rows[rows.length - 1].push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        rows[rows.length - 1].push(field);
        field = '';
        rows.push([]);
      } else field += c;
    }
    rows[rows.length - 1].push(field);
    return rows.filter((row) => row.some((cell) => cell !== ''));
  }

  // Bring back sets and notes from a file saved with "Download data". A set already here
  // (same number, same creation time) gets the notes of the file; any other set is added,
  // under a new number if its own is taken.
  function importData(text) {
    const body = text.replace(/^﻿/, ''), firstLine = body.split(/\r|\n/, 1)[0];
    const separator = firstLine.split(';').length > firstLine.split(',').length ? ';' : ',';
    const rows = parseCsv(body, separator), header = (rows.shift() || []).map((name) => name.trim());
    const at = Object.fromEntries(header.map((name, k) => [name, k]));
    if (['set', 'treatment', 'form', 'song_fragment'].some((name) => !(name in at))) throw new Error('it was not made with “Download data”');
    const read = (row, name) => (name in at ? (row[at[name]] ?? '') : '').trim();
    const number = (value) => (value === '' || !Number.isFinite(Number(value.replace(',', '.'))) ? null : Number(value.replace(',', '.')));

    const groups = new Map();
    for (const row of rows) {
      const key = `${read(row, 'set')}|${read(row, 'generated')}`;
      groups.set(key, [...(groups.get(key) || []), row]);
    }
    const result = { added: 0, updated: 0, first: null };
    for (const group of groups.values()) {
      if ('order' in at) group.sort((a, b) => Number(read(a, 'order')) - Number(read(b, 'order')));
      const start = group[0];
      let recorded = {};
      try { recorded = JSON.parse(read(start, 'settings_json') || '{}'); } catch (error) { /* older file: use the plain columns */ }
      const { ordered = /^\d+_/.test(read(start, 'file_name')), ...settings } = recorded;
      const plain = { bias: 'maximized_bias', fm: 'attenuated_modulation_kept', gap: 'note_gap_ms', pause: 'fragment_gap_ms', target: 'target_seconds' };
      const fromColumns = Object.fromEntries(Object.entries(plain).map(([key, name]) => [key, number(read(start, name))]).filter(([, value]) => value != null));
      const set = {
        number: Math.round(number(read(start, 'set')) ?? NaN), created: read(start, 'generated') || new Date().toISOString(),
        seed: number(read(start, 'seed')) ?? 0, settings: { ...E, ...fromColumns, ...settings }, ordered,
        session: Object.fromEntries([['date', read(start, 'date')],
          ['latitude', number(read(start, 'latitude'))], ['longitude', number(read(start, 'longitude'))]]
          .filter(([, value]) => value !== '' && value != null)),
        items: group.map((row) => {
          const observed = {}, spent = number(read(row, 'time_spent_under_1m_seconds'));
          if (spent != null) Object.assign(observed, { minutes: Math.floor(spent / 60), seconds: Math.round(spent % 60) });
          for (const [key, name] of [['max1', 'max_obs_1m'], ['max2', 'max_obs_2m'], ['max5', 'max_obs_5m']]) {
            const value = number(read(row, name));
            if (value != null) observed[key] = Math.max(0, Math.round(value));
          }
          if (read(row, 'hour')) observed.hour = read(row, 'hour').slice(0, 5);
          if (read(row, 'comments')) observed.comments = row[at.comments];
          const fragment = read(row, 'song_fragment');
          return { treatment: read(row, 'treatment'), form: read(row, 'form'), fragment: /\.wav$/i.test(fragment) ? fragment : `${fragment}.wav`,
            bird: read(row, 'bird'), notes: number(read(row, 'notes')) ?? 0, seconds: number(read(row, 'stimulus_seconds')) ?? 0, replaced: 0, observed };
        }),
      };
      if (!(set.number >= 1)) continue;
      for (const item of set.items) {
        try {
          const out = Lab.outlineSong(D, optionsOf(item, set));
          Object.assign(item, { notes: out.notes.length, seconds: out.duration, replaced: out.replaced });
        } catch (error) { /* a fragment this page does not have: keep what the file says */ }
      }
      const here = sets.find((other) => other.number === set.number && other.created === set.created);
      if (here) {
        set.items.forEach((item, k) => { if (here.items[k]) here.items[k].observed = { ...here.items[k].observed, ...item.observed }; });
        here.session = { ...here.session, ...set.session };
        result.updated++;
      } else {
        if (sets.some((other) => other.number === set.number)) set.number = freeNumber();
        sets.push(set);
        result.added++;
      }
      result.first = result.first ?? (here || set).number;
    }
    if (!result.added && !result.updated) throw new Error('it holds no set');
    return result;
  }
  $('import').addEventListener('click', () => $('import-file').click());

      notify(`${file.name}: ${plural(result.added, 'set')} added, ${result.updated} updated`);

      notify(`Could not import ${file.name}: ${error.message}`);

  const asking = (on) => { $('confirm').hidden = !on; $('clear').hidden = on; };
  $('clear').addEventListener('click', () => asking(true));
  $('clear-no').addEventListener('click', () => asking(false));

  function download(name, parts, type) {
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob(parts, { type })), download: name });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  function manifest() {
    const { out } = current, { song, morph, other } = names();
    const treatment = {
      original: {},
      maximized: {
        bias_formula: '(count_in_fragment + prior_notes * p_form) * ((p_form + smoothing) / (p_other + smoothing)) ** bias, '
          + 'normalized and rounded to whole notes by largest remainders; notes whose type is kept stay as recorded',
        bias: state.bias, prior_notes: Lab.PRIOR_NOTES, smoothing: Lab.SMOOTHING, seed: state.seed, contrast_morph: other,
        notes_replaced: out.replaced, generator: 'mulberry32',

      attenuated: {

    if (state.treatment === 'attenuated') {

        silences_replaced_by_glides: state.join });
    }
    return {
      file: `${fileStem()}.wav`, morph, treatment: state.treatment, ...treatment,
      song_fragment: song.name, bird: song.bird, n_syllables: out.notes.length,
      fragment_own_bias: placeOf(state.song).bias, fragment_third: THIRDS[placeOf(state.song).third],
      duration_s: out.duration, sample_rate_hz: out.sampleRate,
      n_fragments: out.repeats, fragment_starts_s: out.fragments.map(([start]) => start),
      fragment_duration_s: out.fragments[0][1] - out.fragments[0][0], minimum_fragment_notes: MIN_NOTES,
      timing: { note_gap_ms: state.gap, fragment_gap_ms: state.pause, target_duration_s: state.target,
        lead_ms: state.lead, trail_ms: state.trail, fade_ms: state.fade },
      onsets_s: out.onsets, clusters: out.sequence, cluster_letters: out.sequence.map((cluster) => D.letters[cluster]),
      characteristic_score: out.score, original_score: out.baseScore,
      mean_rendered_modulation_rms_hz: out.meanModulation, modulation_retained: out.modulationRetained,
      mean_pitch_hz: out.meanPitch,
      target_active_rms_dbfs: state.level, active_rms_dbfs: out.rmsDb, peak_dbfs: out.peakDb,
      notes: out.notes.map((note) => ({
        position: note.position, cluster: note.cluster, cluster_letter: D.letters[note.cluster], replaced: note.replaced,
        source_syllable: note.sourceName, source_bird: note.sourceBird, source_song: note.sourceSong,
        source_duration_s: note.sourceDuration, duration_s: note.duration,
        original_modulation_rms_hz: note.originalModulation, rendered_modulation_rms_hz: note.renderedModulation,
      })),
      data: D.meta,
    };
  }
  $('save-wav').addEventListener('click', () =>
    download(`${fileStem()}.wav`, [Lab.encodeWav(current.out.audio, current.out.sampleRate)], 'audio/wav'));
  $('save-json').addEventListener('click', () =>
    download(`${fileStem()}.json`, [JSON.stringify(manifest(), null, 2) + '\n'], 'application/json'));

  // ---- Start ------------------------------------------------------------------


  // A cached or long-open page may be older than the published one: move to the latest.
  if (location.protocol.startsWith('http')) {
    fetch(`version.txt?${Date.now()}`, { cache: 'no-store' }).then((reply) => reply.ok ? reply.text() : '').then((text) => {
      const latest = text.trim();
      if (latest && latest !== D.meta.built && new URLSearchParams(location.search).get('v') !== latest) {
        location.replace(`${location.pathname}?v=${encodeURIComponent(latest)}${location.hash}`);

  let listWidth = $('set-list').clientWidth;

  const setTheme = (dark) => {
    if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;

});
